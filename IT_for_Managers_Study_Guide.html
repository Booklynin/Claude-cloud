  id: 'p4', n: 4, part: 'Part A · In your question bank', title: 'DBS: A Bank That Became a Tech Company', nav: 'DBS',
  hook: '“Damn Bloody Slow” to one of the world’s leading digital banks.', meta: 'Session 5 case · 9 lessons',
  blurb: 'Everything so far, in one company: stacks, data, culture and AI, rebuilt over about fourteen years.',
  story: 'We have seen how technology evolved, what it is made of, and how a company picks a backbone. Now see a whole organisation transform itself around technology.',
  bridge: 'DBS showed that AI rests on data. Part B digs under the hood: where data lives and how it moves.',
  lessons: [
    { id: 'why', short: 'Why change', title: 'Why DBS had to change', qb: ['Q15'],
      say: ['DBS (Singapore) was nicknamed **“Damn Bloody Slow”**: ranked lowest in customer service among Singapore’s largest banks. CEO **Piyush Gupta** joined in 2009 and decided to think differently, with board backing and a large budget.',
        'The outside world pushed too. COVID-era mobile banking use rose 34% while branch banking fell 12%. Branches ate 30% of a typical bank’s costs and legacy IT another 20%. Digital challengers ran at a 26% cost-to-income ratio against 60% for traditional banks. Fintechs like PayPal were worth more than some big banks.'],
      viz: { type: 'big', items: [['US$6.02bn', 'net profit FY2022 (+20%)'], ['S$150m + S$25m', 'extra revenue and loss-prevention/productivity from AI in 2022'], ['~S$1bn', 'invested in technology each year for four years'], ['9% / 13%', 'income / net-profit CAGR in the first years']] },
      pts: ['Motivation: worst service ranking, stalled growth, 22,000 staff, and technology mostly outsourced (slow to change).', 'Another success story in your documents: Loblaw, Ping An, Progressive (DBS Exhibit 6). **Q15:** DBS turned from a slow bank into a digital leader; Loblaw grew from grocer to Canada’s largest healthcare software platform.'] },

    { id: 'pillars', short: 'Three pillars', title: 'Digital transformation: the whole-organisation approach', qb: ['Q12', 'Q13', 'Q27'],
      say: ['DBS did not bolt on a chatbot. It used a **whole-organisation approach** with three pillars: **be digital to the core, embed in the customer journey, think and act like a start-up.** Even Audit and HR had to digitalise.',
        'Other banks added standalone AI features (chatbots, face recognition at ATMs) that were “incremental, independent changes that did not affect core processes”. That is the difference between **digital transformation and just buying technology**.'],
      real: 'Fitting a smartphone holder in an old car is not the same as redesigning how you travel.',
      pts: ['Audit used analytics then machine learning (branch risk profiling, trading fraud, credit risk). HR used models for top-performer traits and attrition.', 'Digital transformation here = changing technology, processes, culture and customer experience across the whole organisation, not isolated tools (Q12, Q27).'],
      gap: ['**Digital transformation (Q12):** using digital technology to fundamentally change how an organisation operates and delivers value, which needs culture change, not just new tools. *Example:* DBS.', '**Digitisation vs digitalisation (Q13):** *Digitisation* = converting something analogue into digital form (scanning a paper cheque or form into a file). *Digitalisation* = using digital technology to change how a process works (the cheque deposited by photo on a mobile app, approved and settled online). Digital transformation is the larger change to the whole business.', '**Business-model transformation (Q28):** changing how a company creates and earns money. Your docs: DBS entered e-marketplaces and a carbon exchange; Amazon moved from retailer to marketplace to infrastructure (Session 9 reading).', '**Why serving one more customer costs almost nothing (Q29):** digital goods and services are copied or delivered by software, so the cost of one extra user is close to zero. Your docs: platforms have marginal cost “close to nothing for one more interaction”; eKYC onboarding at near-zero marginal cost.'],
      check: { q: 'How is digital transformation different from simply buying new technology?', a: 'Buying technology adds a tool. Transformation changes the whole organisation (processes, culture, customer journey). DBS ran a whole-organisation programme; other banks added isolated, incremental AI features.' } },

    { id: 'tech', short: 'Overhaul and GANDALF', title: 'Overhauling technology, and the GANDALF wheel', qb: ['Q24', 'Q23'],
      say: ['The first six years went into rebuilding the base: technology and operations merged into one unit, processes made lean, a new enterprise architecture and a new core banking system **live in 12 markets in 28 months**. Two councils (Customer Experience and Innovation) pushed culture.',
        'In 2015 the bank coined **GANDALF**: Google, Amazon, Netflix, Apple, LinkedIn, Facebook, with the **D** for DBS joining those tech giants.'],
      viz: { type: 'flip', title: 'GANDALF “cheese wheel”: five ideas', cards: [['Shift from project to platform', 'Product governance, funding model, agile product management, product owners, modern design principles.'], ['Organise for success', 'Biz-tech organisation, DevOps organisation, service-oriented organisation.'], ['Design for modern systems', 'Micro-services, API, dynamic scalability, auto recovery, DevOps, instrumentation, blue-green deploy, cloud security.'], ['Develop high-performing agile teams', 'Autonomous teams, Scrum, Kanban, scaled agile, agile metrics.'], ['Automate everything', 'Continuous integration, release and test automation, hybrid cloud, auto scaling and monitoring.']] },
      pts: ['Automating the DevOps pipeline from testing to deployment increased release cadence **tenfold** (CI/CD in practice, Q24).', 'Early AI work failed too: a 2013 AI lab with A*STAR (mixed results) and a large IBM Watson wealth-management pilot with no successful outcome.'] },

    { id: 'watson', short: 'Early failures', title: 'The Watson pilot and the lesson', qb: ['L7B'],
      say: ['Early efforts failed. DBS ran a **large-scale pilot with IBM’s Watson for wealth management**, “without a successful outcome”. The learning: agile approaches are a must; start with a **minimum viable product** and fine-tune over time, instead of delivering a fully elaborate solution after a long wait.'],
      pts: ['**Lesson (L7B):** start small (MVP), iterate with agile methods, learn from failures. Gupta called the joint A*STAR projects “signalling tools” for the organisation.'],
      check: { q: 'What happened with DBS’s Watson pilot and what is the lesson?', a: 'A large-scale Watson wealth-management pilot did not succeed. Lesson: use agile delivery, begin with a minimum viable product and refine it over time rather than building a full solution first.' } },

    { id: 'wins', short: 'Early wins', title: 'Early wins: ATM, IVR, AML and Digibank India', qb: ['L3B', 'L7A', 'L8B'],
      say: ['DBS created early wins to build belief. Match each project to what it achieved.'],
      viz: { type: 'match', title: 'Match the project to its result', pairs: [['ATM predictive maintenance (2014)', 'Out-of-cash occurrences down 90%+; fewer reload trips'], ['IVR interception, Singapore contact centre', 'Calls shortened 30 seconds; satisfaction 3.5 → 4.1; volumes −8%'], ['AML machine-learning filter + Cruise case management', 'Analysts handle about a third more cases, with fewer false alerts'], ['Digibank India (2016)', 'Mobile-only bank; Aadhaar onboarding; customers ~6×, transactions 12× at same call-centre headcount']] },
      pts: ['**IVR:** retail contact centre got 5–6m interactions a year, over 80% phone. AI predicts the reason for the call and routes it or sends the customer to the app.', '**AML:** old rules produced up to 98% false positives. A machine-learning model scored risk; lowest-risk cases “hibernate” 90 days; graph “network link”; Cruise integrates it all. Rules could not be removed because of regulation.', '**Digibank India (L8B):** launched 2016 as India’s first mobile-only bank and first to use Aadhaar/biometric for all-digital onboarding.', '**Moving off physical servers (L8A):** by 2020, 99% of applications had been migrated from physical servers to a virtual private cloud. Benefits: scale computing as data grows, lower data-centre footprint, faster deployment.', 'Three AI areas for L3B: ATM cash/maintenance, call-centre routing (IVR), anti-money-laundering; also attrition prediction and personalised “nudges”.'],
      check: { q: 'Describe two examples of how DBS used AI in customer service or operations.', a: '(1) IVR interception: predicts why a customer calls and routes them quickly, cutting call time by 30 seconds and raising satisfaction from 3.5 to 4.1. (2) AML scoring: a model ranks suspicious cases so analysts handle about a third more with better accuracy.' } },

    { id: 'people', short: 'Talent and culture', title: 'People, culture and reskilling', qb: ['Q31'],
      say: ['Technology alone would not have worked. DBS moved from **85% outsourcing toward 85% insourcing** (“building our timber”): hiring tech talent, becoming an employer of choice, and reskilling existing staff.'],
      viz: { type: 'tour', title: 'Culture levers', items: [{ label: 'Hiring', body: 'Hiring spree from 2015; about 200 technology professionals (data scientists, AI experts) in 2017; ex-Google, Yahoo, Huawei.' }, { label: 'DigiFY', body: 'Seven digital skills (journey thinking, agile, data driven, digital business, digital technologies, digital communication, risk and controls). Over 80% of staff by 2020.' }, { label: 'Data Heroes, hack2hire', body: 'Six-month Data Heroes to make data translators; hack2hire engaged ~5,000 employees.' }, { label: 'Experiments', body: 'KPI of **1,000 experiments a year**; Gupta “opened the wallet” so units could hire quasi data scientists (HR’s JIM app; attrition model with ~147 data inputs).' }, { label: 'Reskilling', body: 'Call-centre staff no longer taking calls became live-chat agents and customer-experience designers.' }] },
      pts: ['**Why changing behaviour matters (Q31):** (1) people must use new tools and processes or the technology yields nothing; (2) a data-driven, start-up culture lets experiments and fast change happen; (3) reskilling avoids layoffs and fills skill gaps. (Also: Megatherm’s case says ERP fails from misalignment with organisational readiness.)'] },

    { id: 'data', short: 'Data First and ADA', title: 'Data First, the cloud and the ADA platform', qb: ['L4A', 'L8A'],
      say: ['AI depends on **accessible data**, so in 2018 DBS launched **Data First** with four pillars: analytics capability, culture and curriculum, enablement of data usage, technology platforms. “Everything goes cloud.”',
        'It built **ADA (Advancing DBS with AI)**, a **data platform** for data ingestion, security, storage, governance, visualisation and AI-model management, aiming at **self-service** for staff. By 2020 over 90% of the organisation used ADA.'],
      pts: ['**Data platform (L4A):** one shared place and toolset to collect, store, govern and analyse data so teams can build models themselves.', '**Why before scaling AI:** AI models are only as good as the data they can reach; without a common platform each team rebuilds pipelines, data is inconsistent and AI cannot scale.', 'Housekeeping: data moved from warehouses to cheaper **data lakes**; **80 million** incomplete records cleaned; a **Responsible Data Use Committee** formed.', 'An in-house library of 250+ AI use cases means teams reuse instead of rebuilding.'],
      check: { q: 'What is a data platform and why did DBS build one before scaling AI?', a: 'A shared environment for ingesting, storing, governing, analysing and managing models on data (ADA). AI needs accessible, clean, governed data; a common platform lets many teams build and reuse AI quickly and safely.' } },

    { id: 'box', short: 'Two-in-a-box, PURE', title: 'Two-in-a-box and the PURE principles', qb: ['L4B'],
      say: ['DBS paired a **business lead and a technology lead** in a **“two-in-a-box”** structure with **joint KPIs**, so both own one result. It was introduced to support the Data First culture and deliver a joined-up customer experience, instead of business and tech blaming each other.',
        'For ethics, DBS checks every data use against **PURE**.'],
      viz: { type: 'flip', cards: [['P · Purposeful', 'Data use should be purposeful.'], ['U · Unsurprising', 'Data use should be expected by individuals or corporates.'], ['R · Respectful', 'Data use should respect social norms.'], ['E · Explainable', 'Data use should be explainable as to how and why.']] },
      pts: ['**Two-in-a-box (L4B):** business and technology leads share ownership and joint KPIs.'] },

    { id: 'scale', short: 'Scaling and results', title: 'Scaling AI, new businesses and the results', qb: ['Q28', 'L3A'],
      say: ['By 2023 DBS had 100+ AI/ML algorithms using 15,000 customer data points, producing about **30 million personalised nudges a month** in Singapore (such as duplicate-payment alerts), lifting customer response 10–12%.'],
      viz: { type: 'tour', title: 'Main changes (L3A) in order', items: [{ label: '2009', body: 'Gupta starts; whole-organisation drive; three pillars.' }, { label: '2009–15', body: 'Overhaul technology and operations; core banking in 12 markets in 28 months; councils.' }, { label: '2013–15', body: 'AI lab and Watson failures; GANDALF; early wins (ATM 2014).' }, { label: '2015–17', body: 'Insource talent; Digibank India 2016; RPA with IBM 2017; API platform (150 APIs).' }, { label: '2018–20', body: 'Data First; everything to cloud; ADA; 99% off physical servers; DigiFY.' }, { label: '2021–23', body: 'Carbon exchange CIX; 30m nudges a month; 200+ data use cases, 700+ experts.' }] },
      pts: ['**New business avenues (business-model change):** e-marketplaces (Car, Electricity, Property, Carousel), carbon exchange Climate Impact X (2021), partner **API platform** (150 APIs, 50+ firms), POSB Smart Buddy.', 'RPA: 100+ complex processes automated by 2020 with an IBM Centre of Excellence (2017).', '**Scale:** 200+ data use cases (150+ AI), 700+ data and analytics experts.', 'Weaker: partnership revenue fell short of expectations (partly COVID).', 'Six value drivers of “all in on AI” firms: speed, cost reduction, comprehension of complexity, transformed engagement, fuelled innovation, fortified trust.', 'What next: LLMs, 5G, IoT, blockchain, and digital banks like Grab (licence 2022).'] }
  ],
  quiz: [
    { q: 'DBS’s nickname before transformation was…', o: ['Digital Banking Solutions', 'Damn Bloody Slow', 'Dynamic Bank Singapore', 'Data Bank System'], a: 1, w: 'Damn Bloody Slow.' },
    { q: 'Which is NOT one of DBS’s three pillars?', o: ['Digital to the core', 'Embed in the customer journey', 'Think and act like a start-up', 'Outsource all technology'], a: 3, w: 'DBS moved toward insourcing.' },
    { q: 'What was the Watson lesson?', o: ['Never use AI', 'Use agile and start with a minimum viable product', 'Buy more vendors', 'Avoid pilots'], a: 1, w: 'Agile plus MVP, refined over time.' },
    { q: 'What does ADA stand for?', o: ['Advancing DBS with AI', 'Automated Data Analytics', 'Advanced Digital Apps', 'AI Data Archive'], a: 0, w: 'ADA is the data platform.' },
    { q: 'Two-in-a-box means…', o: ['Two banks merge', 'A business lead and tech lead with joint KPIs', 'Two data centres', 'Two CEOs'], a: 1, w: 'Joint ownership of results.' },
    { q: 'What share of applications moved from physical servers to a virtual private cloud by 2020?', o: ['50%', '75%', '99%', '10%'], a: 2, w: '99%.' },
    { q: 'Digibank India (2016) was notable for…', o: ['A branch network', 'Mobile-only banking with Aadhaar-based digital onboarding', 'Crypto trading', 'ATMs only'], a: 1, w: 'India’s first mobile-only bank and first Aadhaar all-digital onboarding.' },
    { q: 'PURE stands for…', o: ['Purposeful, Unsurprising, Respectful, Explainable', 'Private, Useful, Real, Ethical', 'Protected, Unique, Reliable, Efficient', 'Planned, Used, Reviewed, Enforced'], a: 0, w: 'The responsible-data-use test.' },

PHASES.push({
  id: 'p5', n: 5, part: 'Part B · Data and AI (Session 6)', title: 'Where Data Lives', nav: 'Where Data Lives',
  hook: 'Why your system cannot answer questions about your business.', meta: 'Session 6 · 7 lessons',
  blurb: 'DBS went “Data First”. Here is what that means underneath: the two jobs systems do, the kinds of data, and the six eras of storage.',
  story: 'DBS showed that AI rests on data. Before moving data, we must know where it lives.',
  bridge: 'Now you know where data lives. Next: how it moves, and who decides what it means.',
  lessons: [
    { id: 'davenport', short: 'Competing on analytics', title: 'Why data became a strategy question', say: ['Thomas Davenport (HBR, 2006): products and technology converge, so **business processes are among the few remaining points of differentiation**, and “analytics competitors” (Amazon, Capital One, Harrah’s, Boston Red Sox) wring value from them. Davenport also co-wrote the DBS case.', 'His test has four parts, and **three are organisational**: sponsored from the top; managed at enterprise level (not four definitions of customer); multiple initiatives; hired for judgement. The binding constraint is almost never the algorithm.'], pts: ['Whether you can compete on analytics is settled by architecture years earlier.'] },
    { id: 'jobs', short: 'OLTP vs OLAP', title: 'Two jobs, two machines: OLTP and OLAP', say: ['Systems do two different jobs. **OLTP** runs the business: thousands of tiny, must-be-correct writes (orders, payments). **OLAP** asks questions about it: one huge read over millions of rows. The same database cannot do both well, so there is always a **copy**, and “our numbers do not match” is born in the gap.'], real: 'The till (OLTP) versus the annual sales analysis (OLAP). Running the analysis on the live till could freeze the shop.',
      viz: { type: 'table', cols: ['', 'OLTP', 'OLAP'], rows: [['Job', 'Running the business', 'Asking about the business'], ['Pattern', 'Thousands of tiny reads/writes', 'One enormous read'], ['Needs', 'Correct, never lost', 'Approximately right is often fine'], ['Examples', 'ERP, core banking, point of sale', 'Warehouse, dashboards, board pack']] },
      pts: ['When IT says a report “cannot be run against production”, that is architecture, not obstruction.'] },
    { id: 'kinds', short: 'Three kinds of data', title: 'Three kinds of data', say: ['**Structured** data has fixed rows and columns (invoices). **Semi-structured** has labels but no fixed table (logs, sensor readings, JSON). **Unstructured** has no structure (contracts, email, call recordings, photos). Twenty years ago most useful data was structured; today most new data is not, and estates built before 2015 mostly handle only the first.'],
      viz: { type: 'sort', buckets: ['Structured', 'Semi-structured', 'Unstructured'], items: [['Invoices and ledger postings', 0], ['Stock balances', 0], ['Clickstream logs', 1], ['Sensor readings from equipment', 1], ['Call-centre recordings', 2], ['Scanned contracts', 2], ['CCTV footage', 2], ['App telemetry', 1]] } },
    { id: 'storage', short: 'Six eras of storage', title: 'How storage evolved: six phases, four places', say: ['Nothing was ever switched off. Each phase answered a limit of the last and created its own. Think of a **pendulum**: structure first (trust, but slow), then structure deferred (speed, but trust paid), then both at once.'],
      viz: [{ type: 'tour', numbered: true, title: 'The six phases', items: [
        { label: 'Navigational', body: 'To ~1970. IBM IMS (1968, Apollo). Pre-wired chains of records. Limit: questions fixed when built.' },
        { label: 'Relational', body: 'Codd, June 1970. Tables and SQL; Oracle 1979; **ACID** (a transfer completes fully or not at all). Produced OLTP; still runs the business.' },
        { label: 'Data warehouse', body: '1990s. Inmon (1992) vs Kimball (1996). Second estate for analysis. **Schema-on-write**. Limit: a quarter to change.' },
        { label: 'NoSQL / Hadoop', body: '2003–12. Google GFS and MapReduce papers; Hadoop 2006. Scale and shapeless data by relaxing correctness. Did not replace relational.' },
        { label: 'Data lake', body: '2010–15. James Dixon, 14 Oct 2010. Cheap cloud storage, **schema-on-read**. Without catalogue and owner it becomes a **data swamp**.' },
        { label: 'Cloud + lakehouse', body: '2012–now. Redshift, Snowflake split storage from compute; Delta, Iceberg, Hudi formats. One governed copy over lake storage.' }] },
        { type: 'table', title: 'The four places data lives today', cols: ['Where', 'Good at', 'Bad at'], rows: [['Operational database', 'Speed and correctness per transaction', 'Questions across time or systems'], ['Data warehouse', 'Trusted answers to known questions', 'New questions; non-tabular data'], ['Data lake', 'Keeping everything, cheaply', 'Guaranteeing anything'], ['Lakehouse', 'Most of both with one copy', 'Young; needs discipline']] }],
      pts: ['Ask of any lakehouse proposal: which earlier phase does it let us switch off? If none, who funds all six?'] },
    { id: 'customer', short: 'What is a customer?', title: 'What counts as a customer? Master data and facts, dimensions, grain', say: ['Same person shops in-store, online, returns elsewhere and phones the contact centre: four systems, four records. One customer or four? It looks like marketing but it is architecture. The fix is **master data management** and a **system of record**.', 'Three words let you chair a data meeting: **facts** (things measured: a sale), **dimensions** (ways to slice: store, month), **grain** (what one row means). Get the grain wrong and numbers double-count silently. Before approving a dashboard ask: **what is one row?**'], pts: ['Master data: customer, product, supplier, employee, location, chart of accounts.', 'Cost: hot/warm/cold tiers; storage and compute billed separately; many platforms charge per query, so “who may ask what, how often” is a budget decision.'] },
    { id: 'cases', short: 'Tesco, Walmart, Asian Paints', title: 'Three firms that competed on data', say: ['In none of them was the advantage the technology. It was a decision about who sees what data.'],
      viz: { type: 'flip', cards: [['Tesco Clubcard (1995)', 'dunnhumby analysed loyalty data. Chairman: “you know more about my customers after three months than I know after 30 years.” Ending: by 2015 dunnhumby sale bids ~£700m vs ~£2bn hoped; advantage decays when you stop acting on the data.'], ['Walmart Retail Link', 'Gave suppliers daily store-level sales data; suppliers took over replenishment (vendor-managed inventory), moving forecasting and inventory risk to them.'], ['Asian Paints', '160,000+ retail touchpoints, 4–6 hour connectivity, forecasting at depot-SKU level; inventory norms ~5% lower.']] },
      pts: ['Two numbers to refuse: “Target knew a teen was pregnant” (anecdote unverified) and “35% of Amazon revenue from recommendations” (unsourced).', '**Data residency:** RBI (6 Apr 2018) requires payment data stored only in India; DPDP Act 2023 s.16 lets government restrict transfers to listed countries; DPDP Rules 2025. Decide at design time.'] }
  ],
  quiz: [
    { q: 'OLAP means…', o: ['Running the business', 'Asking questions about the business', 'Online application', 'Open lake and platform'], a: 1, w: 'OLAP = analytical work.' },
    { q: 'Three of Davenport’s four criteria are…', o: ['Technical', 'Organisational', 'Financial', 'Legal'], a: 1, w: 'Binding constraint is organisational.' },
    { q: 'A data lake without a catalogue or owner becomes…', o: ['A warehouse', 'A data swamp', 'A lakehouse', 'A mart'], a: 1, w: 'A swamp.' },
    { q: 'Which is schema-on-write?', o: ['Data lake', 'Data warehouse', 'NoSQL', 'Lakehouse'], a: 1, w: 'Warehouse: structure agreed before data enters.' },
    { q: '“Grain” means…', o: ['Data size', 'What one row represents', 'A data type', 'A security level'], a: 1, w: 'Wrong grain → double-counting.' },
    { q: 'Which is unstructured?', o: ['Invoice table', 'Call recording', 'Stock balance', 'Ledger'], a: 1, w: 'Recordings have no tabular structure.' },
    { q: 'RBI’s 2018 circular requires payment data to be…', o: ['Encrypted only', 'Stored only in India', 'Deleted yearly', 'Shared with banks'], a: 1, w: 'Hard localisation.' }
  ],
  cards: [
    ['OLTP / OLAP', 'Run the business (many small correct writes) / ask about the business (big reads).'],
    ['Structured / semi / unstructured', 'Rows and columns / labelled but no fixed table / no structure.'],
    ['Warehouse / lake / lakehouse', 'Modelled governed copy / cheap raw storage / warehouse governance on lake storage.'],
    ['Schema-on-write vs read', 'Structure before storing (warehouse) vs when querying (lake).'],
    ['Data swamp', 'A lake with no catalogue, owner or quality rules.'],
    ['Master data', 'Core shared entities: customer, product, supplier, employee, location.'],
    ['Fact / dimension / grain', 'Measurement / way to slice / what one row is.'],
    ['Data residency', 'Data must be stored within a named jurisdiction (RBI 2018; DPDP).']
  ]
});
PHASES.push({
  id: 'p6', n: 6, part: 'Part B · Data and AI (Session 7)', title: 'Moving Data', nav: 'Moving Data',
  hook: 'Pipelines, quality and who owns the definition.', meta: 'Session 7 · 6 lessons',
  blurb: 'Data is only useful once it is gathered, moved and refined. This chapter is the plumbing.',
  story: 'We know where data lives. Now: how does it get from where it is created to where it is used, and how do we know it is right?',
  bridge: 'With plumbing understood, Chapter 7 shows why AI is really a data problem, using Sephora.',
  lessons: [
    { id: 'desks', short: 'Four desks', title: 'Data work: four desks and a strategy', say: ['Clive Humby: “data is the new oil”, but the rest of the line is usually dropped: it must be **refined**, and that is where the cost sits. Data work fails at the **handoffs**.'],
      viz: { type: 'table', cols: ['Desk', 'Question', 'Horizon'], rows: [['Chief Data Officer', 'What must we answer; who decides what a word means?', '3–5 yrs'], ['Data architect', 'Where does data sit, how does it move, what may it do?', '2–3 yrs'], ['Data modeller', 'Entities, grain, key', '1–2 yrs'], ['Data engineer', 'How stored, loaded, recovered', 'Weeks']] },
      pts: ['Data management lifecycle: create, store, move, use, protect, retire (name an owner for each).', 'Six strategy decisions: decision inventory; master entities and systems of record; central vs federated; quality bar and who funds it; where data may sit; what gets switched off.'] },
    { id: 'plan', short: 'Plan a database', title: 'Five steps from business question to database', say: ['Each step is cheap to change early and costly later. Renaming an entity on a whiteboard costs a marker; renaming a column in production costs a weekend.'],
      viz: { type: 'tour', numbered: true, items: [{ label: 'Questions', body: 'Write the decisions the app must support, as business questions.' }, { label: 'Conceptual', body: 'Name entities, then fix the **grain** of each.' }, { label: 'Logical', body: 'Keys and relationships; **normalisation** = store each fact once.' }, { label: 'Physical', body: 'Indexes, partitioning, retention, and keeping history when attributes change.' }, { label: 'Master data', body: 'Name master entities, the authoritative system and the named owner before go-live.' }] },
      pts: ['Example (constructed): Southern Staples, a Tamil Nadu distributor. Asked for forecasting; diagnosis was master data (one product under four SKU codes).', 'Field-type traps: money is never floating point; identifiers that look numeric are text; a date is not a timestamp; fixed-value fields belong in lists.'] },
    { id: 'pipe', short: 'Pipelines', title: 'What a data pipeline is', say: ['A **data pipeline** is a scheduled, owned, repeatable process moving data from sources to destinations with defined transformations, stated freshness and completeness, and a decided behaviour on failure. Missing a clause means it is just a script.'],
      viz: { type: 'table', cols: ['Choice', 'Option A', 'Option B'], rows: [['Where to transform', '**ETL**: transform before loading (warehouse era)', '**ELT**: load raw, transform later (cheap storage)'], ['How often', '**Batch**: on a schedule (most reporting)', '**Streaming**: each event as it happens (fraud, payments)']] },
      pts: ['Test for speed: name the decision that changes if data is one hour old, and who makes it.', 'Operate it: named owner, freshness promise, failure behaviour, **data contracts**, lineage, observability, catalogue.'] },
    { id: 'quality', short: 'Data quality', title: 'Data quality is six questions', say: ['“Our data is bad” is unwinnable. Break it into six measurable questions (DAMA UK 2013).'],
      viz: { type: 'match', pairs: [['Completeness', 'Is the data that should be there, there?'], ['Accuracy', 'Does it describe the real world correctly?'], ['Consistency', 'Does it agree across systems?'], ['Timeliness', 'Is it available when the decision is made?'], ['Validity', 'Does it follow the rules?'], ['Uniqueness', 'Is each real thing recorded once?']] } },
    { id: 'own', short: 'Who owns the definition', title: 'Who may change “active customer”?', say: ['Marketing says 3.1 lakh active customers, Finance says 2.4 lakh. Nobody lies: two definitions exist and nobody has authority to choose. If three people can change it, nobody can.'],
      viz: { type: 'flip', cards: [['Central authority', 'One group owns definitions and platform. Consistent but slow. Right for chart of accounts, legal entity, product hierarchy.'], ['Federated stewardship', 'Named stewards in business domains under a thin central standard. Where most large Indian enterprises land.'], ['Domain ownership (data mesh)', 'Each domain publishes data as a product (Dehghani, 2019). Needs engineering maturity.']] } },
    { id: 'plumb', short: 'Plumbing as advantage', title: 'When the plumbing was the advantage', say: ['P&G built decision cockpits for 58,000 staff to stop meetings debating whose number was right. UPI standardised how a payment instruction moves (24.51bn transactions, Aug 2026). Amazon’s c.2002 interface mandate is the ancestor of the **data contract**.'], pts: ['Two numbers not to take into a budget meeting: “bad data costs the US $3.1 trillion” and “poor data quality costs $12.9m a year”. Cost it from your own operations instead.', 'Case Kaps Foods (discussed in class) is not in the repo.'] }
  ],
  quiz: [
    { q: 'A data pipeline must have…', o: ['Only a schedule', 'Scheduled, owned, repeatable, defined transformations, stated guarantees, decided failure behaviour', 'A dashboard', 'A data lake'], a: 1, w: 'Six clauses.' },
    { q: 'ELT means…', o: ['Extract, Transform, Load', 'Extract, Load, Transform', 'Edit, Load, Test', 'Export, Link, Transfer'], a: 1, w: 'Load raw first, transform in the platform.' },
    { q: 'When should you use streaming?', o: ['Always', 'When a decision changes within the latency window', 'For monthly reports', 'Never'], a: 1, w: 'Fraud, payments.' },
    { q: 'One product recorded under four codes is a failure of…', o: ['Timeliness', 'Uniqueness', 'Validity', 'Accuracy'], a: 1, w: 'Uniqueness.' },
    { q: 'A data contract’s most important clause covers…', o: ['Price', 'Notice before changes', 'Colour', 'Storage'], a: 1, w: 'Notice before any change.' },
    { q: 'Federated stewardship means…', o: ['One central group decides all', 'Named stewards in domains under a thin central standard', 'No governance', 'Vendors decide'], a: 1, w: 'Where most Indian enterprises land.' }
  ],
  cards: [
    ['Data pipeline', 'Scheduled, owned, repeatable process moving data with defined transformations, stated guarantees and decided failure behaviour.'],
    ['ETL vs ELT', 'Transform before loading vs load raw then transform.'],
    ['Batch vs streaming', 'Moved on a schedule vs each event as it occurs.'],
    ['Data contract', 'Agreement between producer and consumer on shape, meaning, freshness, owner and notice before change.'],
    ['Six quality dimensions', 'Completeness, accuracy, consistency, timeliness, validity, uniqueness.'],
    ['Normalisation', 'Store each fact in exactly one place.'],

  hook: 'Before the model, the data.', meta: 'Session 8 · Sephora case · 5 lessons',

  lessons: [
    { id: 'case', short: 'The Sephora case', title: 'The case in brief', say: ['Sephora (LVMH-owned, 2,600 stores in 35 countries) leads in AI, AR try-ons and loyalty (Beauty Insider). In June 2024 US CMO **Zena Srivatsa Arnold** must choose between **investing in generative AI** (new, untested, ethical and privacy risks) and **deepening existing AI/AR**, and between **digital-first** ($50–100m a year) and **physical stores** ($100–300m a year; ~1,000 Kohl’s mini-stores gave $1.4bn sales in 2023).'], pts: ['Tools: Virtual Artist (AR), Color IQ (foundation shade), Skin Care IQ, chatbots.'] },

    { id: 'six', short: 'Six questions', title: 'Six questions before funding any AI', say: ['None is about the model. They are about the business around it.'],
      viz: { type: 'tour', numbered: true, items: [{ label: 'Decide', body: 'What exactly will it decide, and who acts on it?' }, { label: 'Truth', body: 'Where will the right answers (ground truth) come from? Often returns data.' }, { label: 'Row', body: 'What is one row (grain)?' }, { label: 'Fresh', body: 'How fresh must the answer be? Freshness is bought.' }, { label: 'Allowed', body: 'Are we allowed to use the data this way?' }, { label: 'Worked', body: 'How will we know it worked? Needs a comparison group.' }] } },
    { id: 'ident', short: 'Identity resolution', title: 'Identity resolution: the capability under every other', say: ['Every personalisation claim assumes one view of the customer. **Identity resolution** decides records describe the same person. **Deterministic** matching joins on a reliable key (loyalty number, verified email): precise, limited. **Probabilistic** matching uses weaker signals: wider coverage, false matches. Hold it in an **identity graph**; a **golden record** is the agreed version; a CDP is a tool, not an answer.'],
      viz: { type: 'match', title: 'Capability → hardest data problem', pairs: [['Virtual try-on / AR', 'Product attribute master across brands'], ['Shade matching', 'Coverage of skin tones and honest labels (returns)'], ['Personalised recommendation', 'Identity resolution across channels'], ['GenAI consultation', 'Content governance'], ['Dynamic pricing', 'Brand-partner contracts and legal limits'], ['Loyalty rewards', 'Definitions: tier, active, who may change']] },
      pts: ['**Match rate** = of multi-channel customers, share correctly recognised as one person. Ask it split by channel.', 'Partner channels: a **data clean room** gives joint insight without exchanging personal data.'] },
    { id: 'estate', short: 'The AI-ready estate', title: 'The estate: four old layers, three new', say: ['AI makes the four places (operational DB, warehouse, lake, lakehouse) more important and adds three layers.'],
      viz: { type: 'table', cols: ['Layer', 'Holds'], rows: [['Semantic layer', 'Agreed definitions (tier, active member, return)'], ['Feature store', 'Versioned model inputs served identically in training and production (avoids training–serving skew)'], ['Vector store / RAG', 'Embeddings of approved content so generative answers come from current, approved material'], ['Model registry', 'Which model version, trained on what, drifting?']] },
      pts: ['Do not start with the platform. Start from the five decisions; add AI layers when needed; keep one copy.', 'Horizon plan: (1) measure match rate and attribute completeness, (2) fund the binding constraint, (3) let the estate follow the decisions, (4) buy a small option and hold a stage gate.', 'Two numbers to refuse: “85% of AI projects fail” (Gartner predicted erroneous outcomes, not failure) and “data scientists spend 80% cleaning data”.'] }
  ],
  quiz: [
    { q: 'Which is NOT a property that passes from data into a model?', o: ['Quality', 'Coverage', 'Latency', 'Brand colour'], a: 3, w: 'Quality, coverage, latency, governance.' },
    { q: 'Deterministic matching joins records on…', o: ['Guesses', 'A reliable shared key', 'Photos', 'Postcodes only'], a: 1, w: 'e.g. loyalty number.' },
    { q: 'Match rate is…', o: ['Share of sales', 'Share of multi-channel customers correctly recognised as one', 'Price match', 'App rating'], a: 1, w: 'The measurable behind personalisation.' },
    { q: 'RAG makes a generative model answer from…', o: ['Memory', 'Approved retrieved content', 'The internet', 'Random text'], a: 1, w: 'Retrieval-augmented generation.' },
    { q: 'Where does ground truth for shade matching come from?', o: ['Surveys', 'Returns and repeat purchases', 'Ads', 'Social media'], a: 1, w: 'An operating process by-product.' },
    { q: 'A data clean room…', o: ['Deletes data', 'Gives joint insight without exchanging personal data', 'Is a server room', 'Stores photos'], a: 1, w: 'For partner channels.' }
  ],
  cards: [
    ['Identity resolution', 'Deciding that records in different systems describe the same person.'],
    ['Golden record', 'Single agreed version of an entity, via survivorship rules.'],
    ['Feature store', 'Versioned model inputs served identically in training and production.'],
    ['RAG', 'Retrieval-augmented generation: answer from approved content.'],
    ['Model drift', 'Quiet decay as the world moves from training data.'],
    ['Ground truth', 'Examples of the correct answer a model learns from.'],
    ['Data clean room', 'Joint insight without exchanging personal data.']

  hook: 'When the rails become public infrastructure.', meta: 'Session 9 · India Stack case · 5 lessons',
  blurb: 'From one firm to many: how value is created between firms, and how India built public rails others build on.',
  story: 'Everything so far was inside one firm. Now the question is how value is created between firms.',
  bridge: 'Head to the Toolkit to drill the exam questions, flashcards and cheat sheet.',
  lessons: [
    { id: 'plat', short: 'Pipeline vs platform', title: 'A platform is a kind of economics', say: ['A **pipeline** business controls a sequence of steps (buy, add, sell). A **platform** enables interactions between groups it does not own and takes a share, supplying governance, standards and protocols rather than the product. Platform marginal cost is close to nothing for one more interaction.'],
      viz: { type: 'table', cols: ['', 'Pipeline', 'Platform'], rows: [['Core asset', 'What it owns', 'Who it connects and the rules'], ['Growth', 'More of the same at falling unit cost', 'More useful to one side as the other grows'], ['Marginal cost', 'Falls but never to nothing', 'Near nothing per interaction'], ['Quality', 'Managed directly', 'Governed via rules'], ['Hard question', 'What to make, at what price?', 'Which side to subsidise, for how long?']] },
      pts: ['Rochet and Tirole (2003): in two-sided markets the profit-maximising price is often below cost on one side.'] },
    { id: 'models', short: 'Ten models, three platforms', title: 'Ten digital business models; only three are platforms', say: ['Classify before claiming network effects. Platform, hypermarket and (partly) ecosystem intermediate; the rest are ordinary businesses with digital delivery.'],
      viz: { type: 'sort', buckets: ['Genuine intermediary (platform-like)', 'Ordinary business, digital delivery'], items: [['Platform (Uber)', 0], ['Hypermarket (Amazon)', 0], ['Ecosystem (Apple)', 0], ['Subscription (streaming)', 1], ['Free ad-funded (Google Search)', 1], ['Freemium (Spotify)', 1], ['Rent not buy (car sharing)', 1], ['Experience (Tesla, Red Bull)', 1]] },
      pts: ['Network effects: cross-side (engine, cold start), same-side (usually negative), negative (spam, fraud). Three abuses: scale is not a network; ignoring multihoming; assuming effects are global when local.'] },
    { id: 'built', short: 'What a platform is made of', title: 'The interface is the product', say: ['Stripe made card acceptance an API call; Klarna made underwriting a 300-millisecond decision; Razorpay did Stripe’s job on rails it did not have to build.'],
      viz: { type: 'match', pairs: [['Public API', 'Versioned endpoints over HTTPS; the interface is the product'], ['SDK', 'Prebuilt code dropped into someone else’s page'], ['Webhook', 'Platform calls you back when an event happens'], ['Idempotency key', 'Makes a retried request safe (no double charge)'], ['Ledger', 'Transactional, double-entry store of record'], ['Sandbox and docs', 'Fake environment plus manual: the distribution channel']] },
      pts: ['Why now in India: three costs collapsed: connectivity (Jio; ₹225/GB 2016 → ~₹18.5 2019), verifying a stranger (Aadhaar eKYC), moving small money (UPI).'] },
    { id: 'stack', short: 'India Stack', title: 'India Stack: three layers, 45 blocks, open protocols', say: ['India Stack answers three questions: **Who am I? What do I have? What do I do?** It has **45 modular blocks** (APIs, standards, protocols, like Lego). Principle: **protocol over platform** (like SMTP: no one owns the inbox) and **“Open, Open, Open”**. Each layer could only be built once the one beneath existed.'],
      viz: { type: 'match', title: 'Block → what it does', pairs: [['Aadhaar auth / eKYC', 'Identity: yes/no or signed record on consent; verification becomes an API call'], ['eSign', 'Legally valid signature as a service'], ['UPI', 'Instant interoperable payments via virtual address'], ['DigiLocker', 'Issuer-pushed verifiable documents'], ['Account Aggregator / DEPA', 'Consent manager passing encrypted data it cannot read'], ['OCEN', 'Lending as easy as a UPI payment (14% of MSMEs had formal credit)'], ['ONDC', 'Open network commerce; buyer, seller, logistics unbundled'], ['CoWIN', 'Vaccination built by composing existing blocks']] },
      pts: ['Aadhaar: 1.5m enrolments a day at under $1; 600m IDs by 2014; authentication returns only yes/no. eKYC use: 30m (2015) → 9bn (2021). UPI launched April 2016 by NPCI. DigiLocker: 160m users.', 'DEPA “privacy double-blind”: no party has all the information.'] },
    { id: 'settle', short: 'What it settles', title: 'What the experiment settles, and what it does not', say: ['**Settled:** public infrastructure solved the cold start by mandate; it moved competition up a layer; it made small customers economic. **Not settled:** open rails still gave a duopoly (about 80% of UPI on PhonePe and Google Pay; 79% in May 2026; the 30% cap keeps being deferred); somebody must pay for the rails (zero merchant fee); exportability is unresolved.'],
      pts: ['Four design choices to steal: protocol over platform; unbundle the transaction; make consent a technical artefact; compose, do not build.', 'Lesson: infrastructure decides which layer of an industry is contestable.'] }
  ],
  quiz: [
    { q: 'Platform marginal cost for one more interaction is…', o: ['High', 'Close to nothing', 'Fixed at 22%', 'Negative'], a: 1, w: 'Which is why winners run away.' },

    { q: 'India Stack’s three questions are…', o: ['Who am I, what do I have, what do I do', 'Where, when, why', 'Buy, sell, hold', 'Pay, save, lend'], a: 0, w: 'Identity, assets/data, transactions.' },
    { q: '“Protocol over platform” means…', o: ['Own the inbox', 'Speak a published standard so no firm owns the network', 'Charge fees', 'Use one app'], a: 1, w: 'SMTP analogy.' },
    { q: 'Roughly what share of UPI volume sits with two apps?', o: ['20%', '50%', '80%', '5%'], a: 2, w: 'About 80%.' },
    { q: 'An idempotency key prevents…', o: ['Hacking', 'A retried request becoming a double charge', 'Slow pages', 'Data loss'], a: 1, w: 'Safe to repeat.' }

    ['Protocol over platform', 'Published standard (like SMTP): no firm owns the network.'],

PHASES.push({ id: 'p9', n: 9, part: 'Exam toolkit', title: 'Exam Toolkit', nav: 'Toolkit', hook: 'Model answers to every Question Bank question, flashcards, a mock quiz and a one-page cheat sheet.', meta: '31 short + 8 long answers', blurb: 'Practise the way the exam works: read the question, answer from memory, then check.' });
const SQ = (n, s, lesson, q, a, ph) => TOOLKIT.short.push({ n, s, lesson, q, a, ph });
SQ(1, 'ok', 'p1/idea', 'Outline the five historical phases of IT in sequence, with period and central technology.', '<ul><li><b>1 Automate</b>, 1930s–60s: electronic computer</li><li><b>2 Inform</b>, 1970s–80s: microprocessor, PC, LAN</li><li><b>3 Integrate</b>, 1990s–2000s: enterprise systems (ERP) and the web</li><li><b>4 Intelligence</b>, 2010s–2025: cloud, mobile, machine learning</li><li><b>5 Autonomy</b>, 2025 onward: agentic AI</li></ul>', 1);
SQ(2, 'ok', 'p1/ph1', 'Main use of IT in Phase 1? Two examples.', 'Substituting for clerical labour in the back office. Examples: **payroll** and **billing** (also ledgers).', 1);
SQ(3, 'ok', 'p1/ph2', 'What is shadow IT? Which phase?', 'Technology used without formal IT approval (e.g. unapproved spreadsheets). First appeared in **Phase 2 (Inform)**. A governance problem, not a technology one.', 1);
SQ(4, 'ok', 'p1/ph4', 'How did cloud change spending from capex to opex?', 'Instead of buying machines upfront (capital), firms rent computing from the cloud (AWS, 2006) and pay as they use it (operating cost that scales with usage).', 1);
SQ(5, 'ok', 'p1/ph5', 'What is agentic AI? Which phase?', 'AI systems that **plan and execute** tasks rather than only answer. **Phase 5 (Autonomy)**: automates judgement, not just execution.', 1);
SQ(6, 'ok', 'p2/two', 'Explain the Application Technology Stack (ATS).', 'What a company **builds software with**. Optimised for **speed of change**; mostly built and assembled; 3–5 year life before rewrite; continuous releases; failure = outages and slow, frightening releases.', 2);
SQ(7, 'ok', 'p2/two', 'Explain the Enterprise Technology Stack (ETS).', 'What a company **runs on**. Optimised for **integrity, continuity and proof**; mostly bought and configured (ERP etc.); 10–20 years; scheduled, regression-tested releases; failure = wrong numbers, failed audit, endless migration.', 2);
SQ(8, 'gap', 'p2/vocab', 'What is a monolithic architecture? One advantage and one disadvantage.', '*(Not in your files.)* One single unit with all parts bundled and released together. **Advantage:** simple to build and deploy at first. **Disadvantage:** any change means redeploying everything; hard to scale or fix one part alone.', 2);
SQ(9, 'part', 'p2/layers', 'Front end vs back end? One example each.', '*(Terms not used in your files; interface layer vs layers below.)* **Front end:** what users see (checkout screen). **Back end:** servers, logic and databases behind it (the system storing the order and computing delivery).', 2);
SQ(10, 'ok', 'p2/six', 'What is a system of record? Example.', 'The one system authoritative for an entity; right by definition when systems disagree. Example: **Workday** for employees, **SAP S/4HANA** for transactions.', 2);
SQ(11, 'part', 'p2/integ', 'What is an API? Example of its use.', 'A published interface another program calls (usually versioned URLs over HTTPS). Example: DBS’s API platform let partners such as McDonald’s and Foodpanda plug in (150 APIs); a payment API lets a shop take a card payment.', 2);
SQ(12, 'part', 'p4/pillars', 'What is digital transformation? Example.', '*(Definition from general knowledge; DBS case supplies the example.)* Using digital technology to fundamentally change how an organisation operates and serves customers, with culture change. Example: **DBS**: digital to the core, customer journey, start-up culture.', 4);
SQ(13, 'gap', 'p4/pillars', 'Distinguish digitisation and digitalisation, with an example each.', '*(Not in your files.)* **Digitisation:** converting analogue to digital (scanning a paper form into a file). **Digitalisation:** using digital tools to change a process (depositing a cheque by photo on a mobile app, approved and settled online).', 4);
SQ(14, 'ok', 'p1/ph4', 'What is a learning loop? Example.', 'Product generates data → data improves the model → model improves the product. Example: a streaming service’s recommendations improve as you watch (Netflix personalisation influences ~80% of hours streamed).', 1);
SQ(15, 'ok', 'p4/why', 'Two companies that transformed successfully, and what each did.', '**DBS:** became a leading digital bank (cloud, ADA data platform, AI, start-up culture). **Loblaw:** grocer expanded into Canada’s largest healthcare software platform (also Ping An, Progressive in DBS Exhibit 6).', 4);
SQ(16, 'part', 'p2/money', 'Three reasons digital transformation programmes fail.', 'From your documents: (1) **organisational misalignment**: the firm cannot agree one way of working; (2) **customising or configuring around the old org chart** (“expensive filing cabinet”) with no one holding decision rights; (3) **ignoring the constraint of the era / incumbency**; also DBS’s early failures: big pilots (Watson) instead of agile MVPs.', 2);
SQ(17, 'ok', 'p1/idea', 'One defining technology per phase.', '1 electronic computer (UNIVAC/IBM 360); 2 microprocessor/PC; 3 ERP/enterprise systems and the web; 4 cloud (AWS); 5 agentic AI.', 1);
SQ(18, 'ok', 'p1/ph3', 'Two major developments of Phase 3, with examples.', '(1) **Enterprise systems (ERP)**, e.g. SAP/Oracle. (2) **The web**, e.g. the browser and first website from CERN; 361m online by 2000.', 1);
SQ(19, 'part', 'p1/ph3', 'What was Y2K? Role in India’s IT industry?', '*(Bug explanation is general knowledge.)* Old software used two-digit years, risking 2000 being read as 1900; fixing it was huge work. **Y2K remediation became India’s entry wedge into global enterprise IT**, starting the global delivery model.', 1);
SQ(20, 'part', 'p1/cost', 'What does Moore’s Law describe? Effect on cost?', '*(Definition general knowledge.)* Transistors per chip roughly double about every two years. Computing cost collapsed: computation per gigaflop fell >99.99% (2000–2017); storage from ~$10,000 per MB (1956).', 1);
SQ(21, 'ok', 'p1/who', 'How did the CIO role change from Phase 3 to Phase 4?', 'Phase 3: CIO entered the C-suite as ERP programmes became bet-the-company projects. Phase 4: with every business unit buying software, the CIO became **broker and risk owner** rather than builder.', 1);
SQ(22, 'part', 'p2/two', 'Two ATS and two ETS technologies.', '**ATS:** microservices, APIs, DevOps / continuous integration. **ETS:** ERP such as SAP S/4HANA and Oracle Fusion; identity systems (single sign-on, MFA).', 2);
SQ(23, 'gap', 'p2/vocab', 'What is microservices architecture? Advantage and disadvantage.', '*(Not in your files.)* Application split into many small independent services that talk through APIs. **Advantage:** change or scale each service independently. **Disadvantage:** more complex to run and coordinate.', 2);
SQ(24, 'gap', 'p2/vocab', 'What is CI/CD? One reason it is useful.', '*(Not defined in your files.)* Continuous Integration: code merged often and automatically built/tested. Continuous Delivery/Deployment: tested code released automatically. **Useful:** faster, safer releases (DBS’s pipeline automation gave tenfold release cadence).', 2);
SQ(25, 'ok', 'p2/integ', 'What is an integration layer? One reason needed.', 'The layer letting applications exchange information in a documented, governed way. Needed because one-to-one links multiply as n(n−1)/2 (10 systems → 45 links).', 2);
SQ(26, 'gap', 'p2/vocab', 'What is cloud-native architecture? One benefit.', '*(Not defined in your files.)* Applications designed from the start for the cloud (microservices, automatic scaling and recovery). **Benefit:** scale up or down on demand and keep running when a part fails.', 2);
SQ(27, 'part', 'p4/pillars', 'How is digital transformation different from buying new technology?', 'Buying adds a tool; transformation changes the organisation. DBS ran a whole-organisation programme, whereas other banks added incremental, standalone AI features that did not touch core processes. Megatherm: ERP “a strategic commitment, not a transactional purchase”.', 4);
SQ(28, 'part', 'p4/pillars', 'What is business-model transformation? Example.', '*(Definition general.)* Changing how a company creates and earns money. Example: DBS entering e-marketplaces and a carbon exchange; Amazon moving from retailer to marketplace to infrastructure.', 4);
SQ(29, 'part', 'p4/pillars', 'Why does serving one more customer cost almost nothing in a digital business? Example.', 'Software delivers the service, so the extra cost per user is close to zero (platforms: marginal cost “close to nothing for one more interaction”). Example: Aadhaar eKYC onboarding at near-zero marginal cost.', 4);
SQ(30, 'part', 'p1/who', 'Two companies whose transformation failed, and a reason each.', '**DEC:** dismissed the PC and was destroyed by the PC its own cost curve created. **Xerox PARC:** invented GUI/Ethernet but commercialised almost nothing. (Nokia, Kodak, Blockbuster, BlackBerry are named casualties; general reason: incumbent assets made the new model look unattractive.)', 1);
SQ(31, 'part', 'p4/people', 'Three reasons changing employee behaviour matters in digital transformation.', '(1) New tools only create value if people use them. (2) A data-driven, start-up culture enables fast change (DBS: 1,000 experiments a year, councils). (3) Reskilling closes capability gaps and keeps staff (DigiFY 80%+; call-centre staff retrained as chat agents).', 4);

LQ(1, 3, 'Megatherm: cloud vs on-premises ERP', 'The CFO wants to keep the on-premises system; the CIO wants cloud ERP.', [
  { k: 'A', s: 'ok', lesson: 'p3/erp', q: 'What is an ERP? Describe four business functions it would integrate.', a: '<b>ERP:</b> integrated software on one shared data model, one source of truth across departments.<ul><li>Finance and controlling (ledger, close, reporting)</li><li>Procurement / materials management (P2P)</li><li>Production planning and manufacturing (bill of materials, shop floor)</li><li>Sales and distribution (O2C), plus CRM and after-sales service</li></ul>A sale recorded once updates stock, receivables, production plan and ledger.' },
  { k: 'B', s: 'part', lesson: 'p3/cloud', q: 'Differences between on-premises and cloud ERP: cost, maintenance, scalability.', a: '<ul><li><b>Cost:</b> on-prem = large upfront licence and servers + ~22% yearly maintenance; cloud = lower upfront, subscription/hosting (case: cost-effective).</li><li><b>Maintenance:</b> on-prem = your IT patches and upgrades; cloud = largely provider *(inferred)*.</li><li><b>Scalability:</b> on-prem limited by own hardware, gives control; cloud scales on demand, faster deployment.</li></ul>' }]);

LQ(6, 3, 'Megatherm: customisation and GST', 'Department heads want the ERP to match current ways of working; it must support e-invoicing and GST.', [
  { k: 'A', s: 'ok', lesson: 'p2/quad', q: 'Configuring vs customising. Why does customisation raise long-term cost?', a: '<b>Configuring:</b> use built-in settings: cheap, supported, survives upgrades. <b>Customising:</b> change the software to fit habits: paid once in cash and <b>forever in upgrade cost</b> (changes retested and redone each upgrade; may block upgrades).' },
  { k: 'B', s: 'ok', lesson: 'p3/india', q: 'What is e-invoicing? How can ERP help with GST?', a: 'Invoices created in a government-prescribed electronic format and reported to the GST portal (above ₹5 crore since Aug 2023; above ₹10 crore must report within 30 days from April 2025 or lose input tax credit). An ERP generates and reports compliant invoices from the same order-to-cash record, with an audit trail.' }]);
