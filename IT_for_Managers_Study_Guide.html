<title>IT for Managers Study Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: a single reading column under a sticky journey bar. One chapter per page, lessons stacked as cards. Light, bright palette only. */
:root{
  --bg:#F6F9FF; --surface:#FFFFFF; --ink:#1C2740; --ink2:#4F5E7B; --line:#D9E3F3; --line2:#EAF0FA;
  --ok:#17804F; --ok-bg:#E1F6EA; --bad:#C2372F; --bad-bg:#FDE7E5;
  --warn-bg:#FFF6DB; --warn-line:#E0AE2B; --warn-ink:#5E4300;
  --a:#1F6FDB; --a-soft:#E6F0FF; --a-ink:#174A94;
  --head:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(28,39,64,.06),0 8px 22px rgba(28,39,64,.06);
  color-scheme:light;
}
[data-ph="1"]{--a:#1F6FDB;--a-soft:#E6F0FF;--a-ink:#174A94}
[data-ph="2"]{--a:#0E8A5F;--a-soft:#E0F7EE;--a-ink:#0A5E41}
[data-ph="3"]{--a:#A86B00;--a-soft:#FFF1C9;--a-ink:#6B4400}
[data-ph="4"]{--a:#D14624;--a-soft:#FFE8E0;--a-ink:#8C2A12}
[data-ph="5"]{--a:#6444D4;--a-soft:#EEE9FF;--a-ink:#41289A}
[data-ph="6"]{--a:#0A8294;--a-soft:#DDF5F9;--a-ink:#065966}
[data-ph="7"]{--a:#C8316A;--a-soft:#FFE5EE;--a-ink:#861E47}
[data-ph="8"]{--a:#4F7F0E;--a-soft:#EBF7D3;--a-ink:#33550A}
[data-ph="9"]{--a:#4252C8;--a-soft:#E8EBFF;--a-ink:#2A3591}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--a);outline-offset:2px}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
b{font-weight:800}
.app{max-width:900px;margin:0 auto}

/* Journey bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px)) 8px;border-bottom:1px solid var(--line);}
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:900px;margin:0 auto 8px}
.brand{font-family:var(--head);font-weight:700;font-size:17px}
.brand small{font-family:var(--body);font-weight:600;color:var(--ink2);font-size:12px;margin-left:8px}
.gprog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);font-weight:700}
.gprog i{display:block;width:90px;height:8px;border-radius:99px;background:var(--line2);overflow:hidden}
.gprog i b{display:block;height:100%;background:#17A673;border-radius:99px;width:0}
.nav{display:flex;gap:6px;overflow-x:auto;max-width:900px;margin:0 auto;padding-bottom:4px;scrollbar-width:thin}
.nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px 5px 6px;display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px;color:var(--ink2)}
.nav button .dot{width:22px;height:22px;border-radius:50%;background:var(--a-soft);color:var(--a-ink);display:grid;place-items:center;font-size:12px;font-weight:800}
.nav button.on{background:var(--a);border-color:var(--a);color:#fff}
.nav button.on .dot{background:#fff;color:var(--a-ink)}
.nav button.fin .dot{background:var(--ok);color:#fff}
.nav .sep{flex:0 0 1px;background:var(--line);margin:4px 4px}

/* Hero */
.hero{padding:30px 0 10px}
.eyebrow{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--a-ink);background:var(--a-soft);padding:4px 10px;border-radius:99px}
.hero h1{font-size:clamp(30px,6vw,46px);margin:12px 0 10px}
.hero .lead{font-size:18px;color:var(--ink2);max-width:62ch}
.story{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:4px}
.story b{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--a-ink)}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.toc a{font-size:13px;font-weight:700;text-decoration:none;color:var(--a-ink);background:var(--a-soft);padding:4px 10px;border-radius:99px}
.toc a.ok{background:var(--ok-bg);color:var(--ok)}
.pprog{margin-top:14px;height:8px;border-radius:99px;background:var(--line2);overflow:hidden}
.pprog b{display:block;height:100%;width:0;background:var(--a);border-radius:99px;transition:width .3s}

/* Lessons */
.lessons{display:grid;gap:18px;margin-top:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px 20px 18px;display:grid;gap:14px;scroll-margin-top:120px}
.card-h{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.card-h .t{display:flex;gap:12px;align-items:flex-start;min-width:0}
.num{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:var(--a);color:#fff;display:grid;place-items:center;font-family:var(--head);font-weight:700}
.card h2{font-size:clamp(20px,3.6vw,25px)}
.qbs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.qb{font-size:11px;font-weight:800;letter-spacing:.04em;padding:2px 8px;border-radius:99px;background:var(--line2);color:var(--ink2)}
.done{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--ink2)}
.done[aria-pressed="true"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.say{display:grid;gap:8px}
.lab{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--a-ink)}
.say p{font-size:17.5px;line-height:1.62}
.say p+p{margin-top:6px}
.pic{background:var(--a-soft);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.pic p{color:var(--a-ink);font-size:16px}
.pts{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.pts li{position:relative;padding-left:26px}
.pts li::before{content:"";position:absolute;left:3px;top:.38em;width:12px;height:7px;border-left:3px solid var(--a);border-bottom:3px solid var(--a);transform:rotate(-45deg)}
.exam{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.gap{border:2px dashed var(--warn-line);background:var(--warn-bg);color:var(--warn-ink);border-radius:14px;padding:12px 14px;display:grid;gap:6px}
.gap .lab{color:var(--warn-ink)}
.gap .pts li::before{border-color:var(--warn-line)}
.check{border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:8px}
.btn{border:0;background:var(--a);color:#fff;border-radius:10px;padding:8px 14px;font-weight:700;justify-self:start}
.btn.ghost{background:var(--a-soft);color:var(--a-ink)}
.btn:disabled{opacity:.45;cursor:default}
.ans{background:var(--ok-bg);border-radius:10px;padding:10px 12px}

/* Viz common */
.viz{border:1px solid var(--line);border-radius:14px;padding:14px;background:linear-gradient(180deg,#fff,var(--bg));display:grid;gap:12px;min-width:0}
.viz-t{font-weight:800;font-size:14px;color:var(--a-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-weight:700;font-size:14px}
.chip.on{background:var(--a);border-color:var(--a);color:#fff}
.panel{background:var(--a-soft);border-radius:12px;padding:12px 14px;display:grid;gap:6px;min-width:0}
.panel .pt{font-family:var(--head);font-weight:700;font-size:18px;color:var(--a-ink)}
.panel ul{margin:0;padding-left:18px;display:grid;gap:3px}
.navrow{display:flex;gap:8px}
.tw{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
table.t{border-collapse:collapse;width:100%;min-width:520px;font-size:14.5px;background:var(--surface)}
table.t th,table.t td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line2)}
table.t th{background:var(--a-soft);color:var(--a-ink);font-weight:800;position:sticky;top:0}
table.t th.k,table.t td.k{font-weight:700;color:var(--ink2);width:22%}
table.t th[data-c]{cursor:pointer}
table.t.spot th:not(.spot):not(.k),table.t.spot td:not(.spot):not(.k){opacity:.38}
.hint{font-size:12.5px;color:var(--ink2)}
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.flip{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left;min-height:92px;display:grid;gap:4px;align-content:start}
.flip .f{font-family:var(--head);font-weight:700;font-size:16px}
.flip .hintt{font-size:12px;color:var(--ink2)}
.flip.on{background:var(--a-soft);border-color:var(--a)}
.game{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.game .col{display:grid;gap:8px;align-content:start;min-width:0}
.gi{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 11px;text-align:left;font-size:14.5px;font-weight:600}
.gi.sel{border-color:var(--a);background:var(--a-soft)}
.gi.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);cursor:default}
.gi.bad{border-color:var(--bad);background:var(--bad-bg);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.score{font-size:13.5px;font-weight:700;color:var(--ink2)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.bucket{border:2px dashed var(--line);border-radius:12px;padding:8px;display:grid;gap:6px;align-content:start;min-height:84px;background:var(--surface);text-align:left}
.bucket.hot{border-color:var(--a);background:var(--a-soft)}
.bucket .bn{font-weight:800;font-size:13.5px;color:var(--a-ink)}
.bucket .gi{font-size:13.5px}
.pool{display:flex;flex-wrap:wrap;gap:6px}
.stack{display:grid;gap:6px}
.layer{border:0;border-radius:12px;padding:10px 14px;text-align:left;background:var(--a-soft);color:var(--a-ink);font-weight:800;display:flex;justify-content:space-between;gap:10px;align-items:center}
.layer span{font-weight:600;font-size:13.5px}
.layer.on{background:var(--a);color:#fff}
.layer.on span{color:#fff}
.axis{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:stretch}
.axis .y{writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-size:12px;font-weight:800;color:var(--ink2);letter-spacing:.04em}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;display:grid;gap:2px;min-height:96px;align-content:start}
.q b{font-family:var(--head);font-size:16px}
.q span{font-size:13px;color:var(--ink2)}
.q.on{background:var(--a-soft);border-color:var(--a)}
.xlab{text-align:center;font-size:12px;font-weight:800;color:var(--ink2);letter-spacing:.04em}
.rng{width:100%;accent-color:var(--a)}
.big{display:flex;gap:12px;flex-wrap:wrap}
.big>div{flex:1 1 150px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.big .n{font-family:var(--head);font-size:28px;font-weight:700;color:var(--a)}
.big .l{font-size:13px;color:var(--ink2)}
.bars{display:grid;gap:8px}
.bar-r{display:grid;grid-template-columns:minmax(96px,28%) 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar-r i{display:block;height:14px;border-radius:99px;background:var(--line2);overflow:hidden}
.bar-r i b{display:block;height:100%;background:var(--a);border-radius:99px}
.bar-r.win i b{background:#17A673}
.sims{display:grid;gap:8px}
.sl{display:grid;grid-template-columns:minmax(120px,34%) 1fr 40px;gap:8px;align-items:center;font-size:13.5px}
.sl output{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.res{display:grid;gap:6px;font-variant-numeric:tabular-nums}
.winner{font-weight:800;color:var(--ok);background:var(--ok-bg);padding:8px 12px;border-radius:10px}

/* Quiz */
.quiz{background:var(--surface);border:1.5px solid var(--a);border-radius:18px;padding:18px;display:grid;gap:12px;margin-top:22px}
.quiz h3{font-size:22px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;font-weight:600;width:100%}
.opt:hover:not(:disabled){border-color:var(--a)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opts{display:grid;gap:8px}
.why{background:var(--a-soft);border-radius:10px;padding:10px 12px;color:var(--a-ink)}
.qprog{font-size:13px;font-weight:800;color:var(--ink2)}
.next-ch{margin-top:22px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;background:var(--a-soft);border-radius:16px;padding:14px 16px}
.next-ch p{color:var(--a-ink);max-width:52ch}

/* Home / toolkit */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:6px;text-align:left;box-shadow:var(--shadow)}
.tile .eb{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--a-ink)}
.tile h3{font-size:19px}
.tile p{font-size:14.5px;color:var(--ink2)}
.tile .m{font-size:12.5px;font-weight:700;color:var(--a-ink)}
.sec{margin-top:26px;display:grid;gap:12px}
.sec>h2{font-size:24px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.status{font-size:12px;font-weight:800;padding:2px 9px;border-radius:99px}
.st-ok{background:var(--ok-bg);color:var(--ok)}
.st-part{background:var(--warn-bg);color:var(--warn-ink)}
.st-gap{background:var(--bad-bg);color:var(--bad)}
.qrow{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;display:grid;gap:10px}
.qrow .qh{display:flex;gap:10px;align-items:flex-start}
.qrow .qn{flex:0 0 auto;font-family:var(--head);font-weight:700;color:var(--a);min-width:30px}
.qrow .qtxt{font-weight:700;font-size:16.5px}
.qrow .qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qrow a{font-size:13px;font-weight:700;color:var(--a-ink)}
.ansb{background:var(--ok-bg);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.ansb ul{margin:0;padding-left:20px;display:grid;gap:3px}
.marks{font-size:12px;font-weight:800;color:var(--a-ink);background:var(--a-soft);padding:1px 8px;border-radius:99px}
.fc{background:var(--surface);border:2px solid var(--a);border-radius:20px;min-height:200px;padding:22px;display:grid;place-items:center;text-align:center;width:100%;box-shadow:var(--shadow)}
.fc .ft{font-family:var(--head);font-size:26px;font-weight:700}
.fc .fb{font-size:18px}
.fc .fh{font-size:12px;color:var(--ink2);margin-top:10px;display:block}
.fcrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select{font:inherit;padding:7px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
.cs h3{font-size:19px;color:var(--a-ink);margin-bottom:6px}
.cs .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.cs ul{margin:0;padding-left:20px;display:grid;gap:3px;font-size:15px}
.cs table.t{min-width:420px;font-size:13.5px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block}
@media (max-width:560px){
  .game{grid-template-columns:1fr}
  .card{padding:16px 14px}
  .say p{font-size:17px}
  .brand small{display:none}
  .sl{grid-template-columns:1fr 40px}
  .sl label{grid-column:1/-1}
  .bar-r{grid-template-columns:1fr auto}
  .bar-r span:first-child{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.gi.bad{animation:none}.pprog b{transition:none}}
</style>
<div id="app" class="app"></div>
<script>
/* ===== ENGINE ===== */
const PHASES = [];
const TOOLKIT = { short: [], long: [], cheat: '' };
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  kids.flat(Infinity).forEach(c => { if (c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(c)); });
  return e;
}
const md = s => String(s == null ? '' : s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*\w])\*([^*\n]+?)\*(?![*\w])/g, '$1<i>$2</i>');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* storage (per-viewer convenience only) */
const KEY = 'itm-guide-v1';
let S = { done: {}, quiz: {}, cards: {} };
try { const r = localStorage.getItem(KEY); if (r) S = Object.assign(S, JSON.parse(r)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

/* ===== VISUALS ===== */
const VIZ = {};

/* tour: chips + panel. numbered => sequential feel with Next */
VIZ.tour = v => {
  const panel = h('div', { class: 'panel', 'aria-live': 'polite' });
  const btns = v.items.map((it, i) => h('button', { class: 'chip', type: 'button', onclick: () => sel(i) }, (v.numbered ? (i + 1) + '. ' : '') + it.label));
  let cur = 0;
  const prev = h('button', { class: 'btn ghost', type: 'button', onclick: () => sel(cur - 1) }, '‹ Back');
  const next = h('button', { class: 'btn', type: 'button', onclick: () => sel(cur + 1) }, 'Next ›');
  function sel(i) {
    if (i < 0 || i >= v.items.length) return;
    cur = i;
    btns.forEach((b, j) => b.classList.toggle('on', j === i));
    const it = v.items[i];
    panel.innerHTML = (it.title ? '<div class="pt">' + md(it.title) + '</div>' : '') + md(it.body);
    prev.disabled = i === 0; next.disabled = i === v.items.length - 1;
  }
  sel(0);
  return h('div', { class: 'viz' }, v.title && h('div', { class: 'viz-t' }, v.title), h('div', { class: 'chips' }, btns), panel,
    v.nav !== false && h('div', { class: 'navrow' }, prev, next), v.hint && h('div', { class: 'hint' }, v.hint));
};

/* table with spotlight columns */
VIZ.table = v => {
  const t = h('table', { class: 't' });
  const head = h('tr'); v.cols.forEach((c, i) => head.append(h('th', { class: i === 0 ? 'k' : '', 'data-c': i, html: md(c), onclick: () => spot(i) })));
  t.append(h('thead', {}, head));
  const tb = h('tbody');
  v.rows.forEach(r => { const tr = h('tr'); r.forEach((c, i) => tr.append(h('td', { class: i === 0 ? 'k' : '', 'data-c': i, html: md(c) }))); tb.append(tr); });
  t.append(tb);
  let on = -1;
  function spot(i) {
    if (i === 0) return;

VIZ.sim = () => {
  const crit = ['Functional fit', 'Integration', 'User experience', 'Deployment flexibility', 'Cybersecurity', 'Vendor reputation', 'Timeline', 'Post-go-live support', 'Cost / TCO'];
  const sc = { A: [8.5, 8.0, 8.0, 9.0, 9.2, 9.0, 6.5, 8.7, 6.0], B: [7.2, 7.5, 8.5, 8.2, 7.4, 7.8, 9.0, 7.2, 9.0], C: [7.8, 7.2, 7.8, 8.0, 7.8, 8.0, 8.0, 7.5, 8.2] };
  const dep = (f, i, u, c, t, v, cost) => [f, i, u, 0, c, v / 2, t, v / 2, cost];
  const P = {
    'Consensus (case)': [20, 10, 5, 10, 10, 10, 10, 10, 15],
    'Finance': dep(25, 15, 10, 5, 10, 15, 20), 'Operations': dep(30, 10, 10, 5, 10, 20, 15), 'IT': dep(20, 20, 5, 20, 5, 15, 15),
    'Sales & Service': dep(25, 10, 20, 5, 10, 20, 10), 'Top management': dep(20, 10, 5, 10, 15, 20, 20)

  let w = P['Consensus (case)'].slice();

  function draw() {

            h('div', { class: 'qmeta' }, h('span', { class: 'status ' + STATUS[t.s][1] }, STATUS[t.s][0]), ref(t)),

function allCards() { const out = []; PHASES.forEach(P => (P.cards || []).forEach((c, i) => out.push({ id: P.id + '-' + i, t: c[0], b: c[1], ph: P.n, pt: P.title }))); return out; }
function flashcards() {
  const wrap = h('div', { style: 'display:grid;gap:12px;justify-items:center' });
  const cards = allCards();
  const sel = h('select', { id: 'fcsel', 'aria-label': 'Deck' }, h('option', { value: 0 }, 'All chapters (' + cards.length + ' cards)'), PHASES.filter(p => p.cards).map(p => h('option', { value: p.n }, 'Chapter ' + p.n + ' · ' + p.title)));
  const only = h('select', { id: 'fcmode', 'aria-label': 'Which cards' }, h('option', { value: 'all' }, 'All cards'), h('option', { value: 'again' }, 'Only the ones I missed'));
  let deck = [], k = 0, flipped = false;
  const fc = h('button', { class: 'fc', type: 'button' }); const cnt = h('div', { class: 'score' }); const row = h('div', { class: 'fcrow' });
  function build() {
    const p = +sel.value; deck = shuffle(cards.filter(c => (p === 0 || c.ph === p) && (only.value === 'all' || S.cards[c.id] === 'again'))); k = 0; draw();
  }
  function draw() {
    flipped = false;
    if (!deck.length) { fc.innerHTML = '<div class="fb">No cards here. Pick another deck.</div>'; cnt.textContent = ''; return; }
    if (k >= deck.length) { fc.innerHTML = '<div class="fb"><b>Deck finished.</b><br>Shuffle for another pass, or switch to “missed” cards.</div>'; cnt.textContent = deck.length + ' / ' + deck.length; return; }
    const c = deck[k]; fc.innerHTML = '<div><div class="ft">' + md(c.t) + '</div><span class="fh">Tap to reveal · Chapter ' + c.ph + '</span></div>'; cnt.textContent = (k + 1) + ' / ' + deck.length;
  }
  fc.addEventListener('click', () => { const c = deck[k]; if (!c) return; flipped = !flipped; fc.innerHTML = flipped ? '<div class="fb">' + md(c.b) + '</div>' : '<div><div class="ft">' + md(c.t) + '</div><span class="fh">Tap to reveal · Chapter ' + c.ph + '</span></div>'; });
  const mark = (v) => () => { const c = deck[k]; if (!c) return; S.cards[c.id] = v; save(); k++; draw(); };
  row.append(h('button', { class: 'btn', type: 'button', onclick: mark('know') }, '✓ I knew it'), h('button', { class: 'btn ghost', type: 'button', onclick: mark('again') }, '↻ Need to review'), h('button', { class: 'btn ghost', type: 'button', onclick: build }, 'Shuffle'));
  sel.addEventListener('change', build); only.addEventListener('change', build);
  wrap.append(h('div', { class: 'fcrow' }, sel, only), cnt, fc, row);
  build(); return wrap;
}

PHASES.push({
  id: 'p1', n: 1, part: 'Part A · In your question bank', title: 'The 100-Year Story', nav: '100 Years',
  hook: 'Five eras of IT, told by what became cheap and what became scarce.', meta: 'Session 1 reading · 10 lessons',
  blurb: 'Before opening any engine, we look at the road behind us. A hundred years of technology squeezed into five phases, and one idea that explains all of them.',
  story: 'We start at the beginning: how did companies end up with the technology they have today? Everything later in the course (stacks, ERP, DBS, data, AI) is a chapter of this same story.',
  bridge: 'Now you know the five eras. Next question: inside a company today, what is the technology actually made of? That is the “stack”.',
  lessons: [
    { id: 'idea', short: 'The big idea', title: 'The one idea: cheap, then scarce', qb: ['Q1'],
      say: ['Do not remember the five eras by their machines. Remember them by the **bottleneck**.',
        'In every era, technology made one thing dramatically **cheap**. The moment that happened, something else became **scarce**, and that scarce thing decided who won. A good manager works on the new scarce thing instead of cheering for the thing that just got cheap.'],
      real: 'A tea stall suddenly gets free gas. Boiling tea is no longer the problem, so the shortage becomes good milk and a good spot. The owner who keeps worrying about gas has missed the new bottleneck. (A teaching picture, not from the reading.)',
      viz: { type: 'tour', title: 'Tap each phase: what got cheap, what became scarce', hint: 'Dates: 1930s–60s, 1970s–80s, 1990s–2000s, 2010s–2025, 2025 onward.', items: [
        { label: '1 · Automate', title: 'Automate · 1930s–60s', body: '<ul><li><b>Cheap:</b> arithmetic</li><li><b>Scarce:</b> clean, coded data</li><li><b>Marker:</b> UNIVAC I, 1951: ~1,000 calculations a second, ~$1m each, ~20 sold</li><li><b>Defining tech:</b> the electronic computer</li></ul>' },
        { label: '2 · Inform', title: 'Inform · 1970s–80s', body: '<ul><li><b>Cheap:</b> computing power</li><li><b>Scarce:</b> managerial control</li><li><b>Marker:</b> Intel 4004, 1971: a whole CPU on one chip, 2,300 transistors</li><li><b>Defining tech:</b> microprocessor, PC, LAN</li></ul>' },
        { label: '3 · Integrate', title: 'Integrate · 1990s–2000s', body: '<ul><li><b>Cheap:</b> connectivity</li><li><b>Scarce:</b> process design</li><li><b>Marker:</b> 2000: 361 million people online, about 6% of humanity</li><li><b>Defining tech:</b> enterprise systems and the web</li></ul>' },
        { label: '4 · Intelligence', title: 'Intelligence · 2010s–2025', body: '<ul><li><b>Cheap:</b> storage and scale</li><li><b>Scarce:</b> proprietary data</li><li><b>Marker:</b> 2025: ~6bn online (74%), 96% of them via mobile</li><li><b>Defining tech:</b> cloud, mobile, machine learning</li></ul>' },
        { label: '5 · Autonomy', title: 'Autonomy · 2025 onward (contested)', body: '<ul><li><b>Cheap:</b> cognition</li><li><b>Scarce:</b> accountable judgement</li><li><b>Marker:</b> 2026: ~89% of firms use AI somewhere; ~20% have scaled agents</li><li><b>Defining tech:</b> agentic AI</li></ul>' }] },
      pts: ['Define each phase by the **constraint**, not the hardware.', 'The manager’s job: work on the new constraint.', 'The five names in order: **Automate, Inform, Integrate, Intelligence, Autonomy**.'],
      check: { q: 'In Phase 3 connectivity became cheap. What became scarce, and why does that explain why ERP programmes struggled?', a: '**Process design** became scarce. ERP programmes failed mostly on organisational grounds (people could not agree one way of working), not because the software was broken.' } },

    { id: 'ph1', short: 'Phase 1 Automate', title: 'Phase 1 · Automate (1930s–60s)', qb: ['Q1', 'Q2', 'Q17'],
      say: ['Computers arrived as giant, expensive machines. Their job was simple: replace rows of clerks doing arithmetic in the back office, in things like **payroll, ledgers and billing**.',
        'Because the machine was a huge capital purchase, **Finance** decided whether to buy it, appraising it like a lathe in a factory. And it gave little real competitive advantage. The true bottleneck was never the sums. It was **data discipline**: the machine was useless until every input was standardised and coded.'],
      real: 'J. Lyons & Co, a tea-shop chain, ran LEO in 1951: the first business computer. A catering company, not a computer company, ran the first business application.',
      pts: ['**Main use:** substituting clerical labour in the back office. **Examples:** payroll, ledgers, billing.', 'ENIAC (1946): ~18,000 vacuum tubes, 30 tons. UNIVAC I delivered to the US Census Bureau, June 1951.', 'IBM System/360 announced 7 April 1964 in 63 cities across 14 countries. By 1965 IBM held **65%** of the market on **$2.5bn** revenue. Thomas Watson Jr. bet ~$5bn on it, more than the Manhattan Project.', 'Grace Hopper (compiler, COBOL) did more for adoption than anyone who built hardware.', 'Who decides spend: **Finance**. IT is for **cost reduction**. Dominant risk: a wrong-sized asset.'],
      check: { q: 'What was the main use of IT in Phase 1? Give two examples.', a: 'Replacing clerical labour in the back office. Examples: payroll and billing (also ledgers).' } },

    { id: 'ph2', short: 'Phase 2 Inform', title: 'Phase 2 · Inform (1970s–80s) and the birth of shadow IT', qb: ['Q1', 'Q3', 'Q17'],
      say: ['Computers got small and cheap. DEC’s PDP-8 (1965) was the first computer under $20,000. Then Intel put a CPU on one chip (the 4004, 1971). Then came the Apple II (1977) and the IBM PC (1981).',
        'IT now did two jobs at once. **Formally:** management reports and decision support. **Informally:** staff built their own spreadsheets that nobody had approved. That unofficial, unapproved technology is **shadow IT**. It is a **governance problem, not a technology problem**.'],
      real: 'Imagine a department head who gets tired of waiting for the official report and builds her own spreadsheet. It works, so ten colleagues copy it. Now the company runs on a file IT has never seen.',
      pts: ['**Shadow IT** = technology used without formal approval (first appeared in **Phase 2**, from unapproved spreadsheets).', 'Who decides spend: functional heads (and shadow IT). Key question: **who controls the tools?**', 'Advantage appeared only where IT changed a competitive process, not where it simply computerised an existing one.', 'DEC took a computer from $1m to $18,500 and was then destroyed by the PC its own cost curve created.', 'Same era: SAP founded 1972; TCS 1968; Infosys 1981; Wipro pivoted out of vegetable oil.'],
      check: { q: 'What is shadow IT, and in which phase did it first appear?', a: 'Technology that staff use without formal IT approval (for example unapproved spreadsheets). It first appeared in **Phase 2 (Inform)**.' } },

    { id: 'ph3', short: 'Phase 3 Integrate', title: 'Phase 3 · Integrate (1990s–2000s): ERP, the web and the CIO', qb: ['Q17', 'Q18', 'Q19', 'Q21'],
      say: ['Two waves landed together. **Enterprise systems** put separate departments onto one shared data model. And the **web** arrived: built at CERN in 1989–90, first website August 1991, 361 million people online by 2000.',
        'These programmes were so big and so risky that they became bet-the-company capital projects. That is why the **CIO entered the C-suite**. The money was made not by the software but by **redesigning the business process** around it. Firms that merely configured the system around their old org chart “bought a very expensive filing cabinet”.'],
      real: 'Two shops install the same billing system. One changes how it takes orders, ships and bills. The other copies its old paper forms into the screen. Only the first gets the benefit.',
      pts: ['**Two developments:** (1) enterprise systems / ERP (e.g. SAP, Oracle), (2) the web / internet (browser, websites).', 'Who decides spend: **CIO and board**. Key question: **what process should exist?**', 'Dominant risk: programme failure and disintermediation. Advantage came from **operating-model redesign**.', 'Leaders: Microsoft, Cisco, Oracle, SAP, Dell. Amazon (1994) and Google (1998) were widely dismissed at the time.'],
      gap: ['**What Y2K was (Q19).** Your reading only says “Y2K remediation became India’s entry wedge into global enterprise IT”. The standard background: many old programs stored years as two digits, so the year 2000 might be read as 1900. Companies worldwide had to find and fix the code, and a lot of that work went to Indian IT firms, which gave them a way into global enterprise IT.'],
      check: { q: 'What were the two major developments of Phase 3? Give an example of each.', a: '(1) **Enterprise systems** such as ERP from SAP or Oracle, putting functions on one data model. (2) **The web**: the first browser and website from CERN, 361m people online by 2000.' } },

    { id: 'ph4', short: 'Phase 4 Intelligence', title: 'Phase 4 · Intelligence (2010s–2025): cloud, mobile and learning loops', qb: ['Q4', 'Q14', 'Q17', 'Q21'],
      say: ['**Cloud** changed how companies pay. AWS launched in 2006 and turned IT from a big upfront purchase (**capital expenditure**) into a metered bill you pay as you use it (**operating expenditure**). **Mobile** put a networked computer in nearly every hand. **Machine learning** turned stored data into predictions.',
        'IT now exists to run **learning loops**: the product creates data, the data improves the model, the model improves the product, and round it goes. And now **everyone decides**: business units buy software directly with a card. So the CIO shifts from **builder** to **broker and risk owner**.'],
      real: 'Capex to opex is the difference between buying a generator for your shop and paying the electricity bill. Learning loop: the more you watch on a streaming app, the better it recommends, so you watch more. (Netflix’s personalisation “influences choice for about 80% of hours streamed”, per the Session 6 material.)',
      pts: ['**Capex to opex:** cloud lets firms rent computing and pay per use, instead of buying machines upfront. Cost unit becomes “per unit consumed”.', '**Learning loop:** product generates data → data improves the model → model improves the product.', 'Who decides spend: **every business unit**. The CIO: from builder to **broker and risk owner**.', 'India: Jio collapsed data prices from 2016; UPI built payments at national scale.', 'Dominant risk: concentration and privacy. Key question: what does our data let us know?', 'Today’s shadow IT: 81% of SaaS spend is controlled by business units and only 56% of apps in use carry IT approval.'],
      check: { q: 'How did cloud computing change IT spending from capital expenditure to operating expenditure?', a: 'Before cloud, firms bought machines upfront (large, irreversible capital spend). With cloud (AWS, 2006) they rent capacity and pay for what they use, so it appears as an ongoing **operating** cost that scales with use.' } },

    { id: 'ph5', short: 'Phase 5 Autonomy', title: 'Phase 5 · Autonomy (2025 onward): agentic AI', qb: ['Q5', 'Q17'],
      say: ['Earlier AI answered questions. **Agentic AI** plans and carries out tasks. Every earlier phase automated doing. This is the first to automate **judgement**: the thing you delegate is no longer a task, it is a decision.',
        'Look at the gap. In a 2025 Gartner survey, **75%** of organisations were piloting or running some AI agent, but only **15%** were touching fully autonomous ones. That gap is about **governance** (who is accountable), not about whether the technology works.'],
      real: 'Giving a new employee a checklist is automation. Giving them the authority to approve a customer refund by themselves is delegation of judgement. Most firms are happy with the first and nervous about the second.',
      pts: ['**Agentic AI** = systems that plan and execute rather than only answer. Belongs to **Phase 5 (Autonomy)**.', 'McKinsey 2026 (n=1,719, 97 nations): ~9 in 10 firms use AI in at least one function; ~**20%** have scaled agents (40% of firms above $1bn revenue vs 22% below).', 'Gartner (May–June 2025, n=360): **75%** piloting/deploying some agent; only **15%** fully autonomous ones.', 'Key question: **what may we delegate?** Dominant risk: accountability and model risk.', 'Treat the phase as a hypothesis. Adoption figures are self-reported survey answers.'],
      check: { q: 'What is agentic AI? Which phase does it belong to?', a: 'AI systems that **plan and execute** rather than only answer. They belong to **Phase 5, Autonomy** (2025 onward), the first phase that automates judgement.' } },

    { id: 'who', short: 'Winners and casualties', title: 'Who led each phase, and who was destroyed', qb: ['Q21', 'Q30'],
      say: ['Here is a pattern that surprises people: **leadership almost never carried forward**. Of the firms that led Phase 1, only IBM led Phase 2, and it led neither Phase 3 nor 4.',
        'Why? Because **incumbency is closer to a liability than an asset**. The assets, sales force and profit margins that won the last phase make the next one look unattractive. DEC drove the price of a computer from a million dollars to seven thousand, and was destroyed by the personal computer its own cost curve made inevitable.'],
      viz: { type: 'match', title: 'Match the clue to the company or group', pairs: [['Led Phase 1 with a 65% share in 1965', 'IBM'], ['Killed by the PC its own cost curve created', 'DEC (also Wang, Data General)'], ['Invented the GUI and Ethernet but commercialised almost nothing', 'Xerox PARC'], ['Exited computing entirely after Phase 1', 'GE and RCA'], ['Casualties of Phase 4 (mobile and digital)', 'Nokia, BlackBerry, Kodak, Blockbuster'], ['Dismissed in the 1990s, later huge', 'Amazon (1994) and Google (1998)']] },
      pts: ['Nvidia is the rare firm that led Phase 4 after being a Phase-3 component supplier. It had no fab to defend and no x86 margin to protect, which Intel did.', 'Phase 4 leaders: AWS, Apple, Google, Microsoft, Nvidia, TSMC. Phase 5: unresolved (OpenAI, Anthropic, DeepMind on models; Nvidia on compute; Microsoft on distribution).', '**Two failures with a reason from your documents (Q30):** DEC (dismissed the PC; wrong about who would buy it) and Xerox (commercialised almost nothing it invented). Nokia, Kodak, Blockbuster and BlackBerry are named as Phase 4 casualties; the reading gives the general reason: past winning assets made the new model look unattractive.'],

    { id: 'cost', short: 'What happened to cost', title: 'Cost: everything got cheaper, nothing got smaller', qb: ['Q4', 'Q20'],
      say: ['Three curves collapsed at once: storage, computation and, most recently, AI inference. The 1956 IBM RAMAC held 5 MB and leased for $3,200 a month, roughly **$10,000 per megabyte**. Hard drive cost has since fallen about **41% a year**, close to what Moore’s law describes for chips.',
        'The twist managers get wrong: **cheaper never meant less spending**. Four orders of magnitude of unit-cost fall have never reduced IT’s share of corporate revenue, because use grows faster than price falls. This is the Jevons idea.'],
      viz: [{ type: 'table', title: 'Cost per gigabyte of storage', cols: ['Year', 'Storage, $ per GB'], rows: [['1956', '~$2,000,000'], ['1980', '~$100,000'], ['1990', '~$10,000'], ['2000', '~$10'], ['2010', '~$0.10'], ['2017', '~$0.03'], ['2025', '~$0.01 (HDD)']] },
        { type: 'table', title: 'The unit of cost changed in every phase', cols: ['Phase', 'Unit of cost', 'Budget line', 'Character of decision'], rows: [['1 Automate', 'Per machine', 'Capital', 'Large, irreversible, board-level'], ['2 Inform', 'Per seat, per department', 'Departmental capex', 'Small, reversible, uncontrolled'], ['3 Integrate', 'Per programme + licences', 'Multi-year capital', 'Very large, bet-the-company'], ['4 Intelligence', 'Per unit consumed', 'Operating', 'Reversible but sticky; scales with success'], ['5 Autonomy', 'Per token, per task', 'Operating, often unbudgeted', 'Usage is unpredictable']] }],
      pts: ['Computation per gigaflop fell more than **99.99%** (2000–2017). AI inference fell **280×** ($20.00 to $0.07 per million tokens, Nov 2022–Oct 2024).', 'Three caveats: (1) **cost per token is not cost per answer** (reasoning models use many more tokens); (2) **inference is the recurring bill** (~80% of AI budget vs ~20% training); (3) **cheaper never meant less**.', 'Cost figures are order-of-magnitude approximations. Good for the shape, not for precise values.'],
      gap: ['**What Moore’s law says (Q20).** Your reading only says hard-drive cost fell at a rate “close to what Moore’s law describes for semiconductors” and shows chips going from 2,300 transistors (1971) to 16bn (2020) to 208bn (2024). The standard definition: the number of transistors on a chip roughly doubles about every two years, so computing power per rupee keeps rising and cost keeps falling.'],
      check: { q: 'If AI inference gets 100× cheaper again, will your firm’s AI bill fall?', a: 'Probably **not**. Consumption tends to grow faster than the unit price falls, reasoning models use more tokens per answer, and inference is the recurring bill that scales with adoption.' } },

    { id: 'nolan', short: 'Which phase are you in?', title: 'Which phase is your firm really in?', qb: [],
      say: ['Nolan’s stages-of-growth model (HBR, 1979) said a **firm** moves through IT stages in order. The phases here describe an **era**. So a 2026 firm can behave like Phase 2 while buying Phase 4 technology, and that gap is where most IT failure lives.',
        'To diagnose, look at behaviour, not purchases. Ask three questions: where does the money go, who signs, and what is scarce?'],
      viz: { type: 'sort', title: 'Which phase does this behaviour look like?', buckets: ['Phase 1 Automate', 'Phase 2 Inform', 'Phase 3 Integrate', 'Phase 4 Intelligence'], items: [['Only Finance signs off technology spend', 0], ['Binding constraint is clean data, not compute', 0], ['Department heads use tools IT never approved', 1], ['Most of the tech budget just maintains existing systems', 2], ['Every business unit buys software directly', 3]] },
      pts: ['Phases are analytical devices, not history. Dates overlap and every phase is still alive somewhere.', 'Look at behaviour, not at what the firm has bought.'] }
  ],
  quiz: [
    { q: 'What is the best way to define each of the five phases?', o: ['By the hardware used', 'By what became cheap and what therefore became scarce', 'By the company that led it', 'By the decade'], a: 1, w: 'The organising idea is the constraint, not the hardware.' },
    { q: 'Which pair is correct for Phase 1 (Automate)?', o: ['Cheap: connectivity, scarce: process design', 'Cheap: arithmetic, scarce: clean coded data', 'Cheap: storage, scarce: proprietary data', 'Cheap: cognition, scarce: accountable judgement'], a: 1, w: 'Phase 1: arithmetic cheap; clean, coded data scarce.' },
    { q: 'Shadow IT first appeared in which phase?', o: ['Phase 1', 'Phase 2', 'Phase 3', 'Phase 5'], a: 1, w: 'Phase 2 (Inform): unapproved spreadsheets and personal productivity.' },
    { q: 'Why did the CIO enter the C-suite in Phase 3?', o: ['Because of mobile phones', 'Because enterprise programmes became bet-the-company capital projects', 'Because Finance stopped caring', 'Because of AI agents'], a: 1, w: 'ERP-type programmes were so large and risky that the CIO joined the top table.' },
    { q: 'Cloud changed IT spending from…', o: ['Opex to capex', 'Capex to opex', 'Capex to shadow IT', 'Per-seat to per-machine'], a: 1, w: 'Capital expenditure (buy machines) became operating expenditure (pay as you use).' },
    { q: 'Which describes a learning loop?', o: ['Staff training that repeats yearly', 'Product generates data, data improves the model, model improves the product', 'A loop in software code', 'A quarterly audit cycle'], a: 1, w: 'That is the Phase 4 definition from the reading.' },
    { q: 'In Gartner’s 2025 survey, what share of organisations were piloting or running ANY AI agent vs fully autonomous ones?', o: ['89% and 20%', '75% and 15%', '40% and 22%', '6% and 74%'], a: 1, w: 'Gartner: 75% any agent, 15% fully autonomous. The gap is governance.' },
    { q: 'Why did phase leadership rarely carry forward?', o: ['Regulators broke up the leaders', 'Incumbency is a liability: the assets and margins that won the last phase make the next look unattractive', 'New firms always had more money', 'India took the lead'], a: 1, w: 'DEC and the PC is the classic example.' },
    { q: 'Which is NOT one of the three caveats about AI costs?', o: ['Cost per token is not cost per answer', 'Inference is the recurring bill', 'Cheaper never meant less', 'Training is the main recurring bill'], a: 3, w: 'Inference (~80%), not training (~20%), is the recurring bill.' }
  ],
  cards: [
    ['The organising idea of the 100-year story', 'Each phase made one thing cheap, which made something else scarce. Work on the new scarce thing.'],
    ['Phase 1 · Automate', '1930s–60s. Arithmetic cheap; clean coded data scarce. Back-office clerical work (payroll, ledgers, billing). Finance decides. IBM leads (65% in 1965).'],
    ['Phase 2 · Inform', '1970s–80s. Computing power cheap; managerial control scarce. PC and spreadsheets. Birth of shadow IT. Intel 4004 (2,300 transistors, 1971).'],
    ['Phase 3 · Integrate', '1990s–2000s. Connectivity cheap; process design scarce. ERP + the web. CIO enters the C-suite. Y2K was India’s entry wedge.'],
    ['Phase 4 · Intelligence', '2010s–2025. Storage and scale cheap; proprietary data scarce. Cloud (AWS 2006), mobile, ML, learning loops. CIO becomes broker and risk owner.'],
    ['Phase 5 · Autonomy', '2025 onward. Cognition cheap; accountable judgement scarce. Agentic AI automates judgement. 75% pilot agents; 15% fully autonomous.'],
    ['Shadow IT', 'Technology used without formal IT approval. First appeared in Phase 2. A governance problem, not a technology one.'],
    ['Agentic AI', 'AI that plans and executes tasks rather than only answering. Phase 5.'],
    ['Learning loop', 'Product generates data → data improves the model → model improves the product.'],
    ['Capex to opex (cloud)', 'Buying machines upfront became renting computing and paying per use.'],

    ['Jevons / “cheaper never meant less”', 'Unit cost fell four orders of magnitude yet IT’s share of revenue never fell, because consumption grows faster than the price falls.'],
    ['Three AI cost caveats', 'Cost per token is not cost per answer; inference (not training) is the recurring bill (~80/20); cheaper never meant less.'],

    ['Moore’s law', '(Standard definition, not in your files) transistors on a chip roughly double about every two years. Your reading: chips 2,300 (1971) → 16bn (2020) → 208bn (2024).']
  ]

PHASES.push({
  id: 'p2', n: 2, part: 'Part A · In your question bank', title: 'The Two Stacks', nav: 'Two Stacks',
  hook: 'ATS vs ETS, the layers a company runs on, and where the money really hides.', meta: 'Session 1 slides + Session 3 ideas · 9 lessons',
  blurb: 'A “technology stack” sounds like one thing. It is actually two. Learn to tell them apart, name the layers, and you can place almost any IT problem in the right box and ask the right person.',
  story: 'Chapter 1 told us how technology grew. Now we open today’s company and look inside: what is it built from, and what is it run on?',
  bridge: 'You now know the layers. The biggest single piece of the enterprise stack is the ERP, the backbone. Next we watch a real company decide about one.',
  lessons: [
    { id: 'two', short: 'ATS vs ETS', title: 'Two stacks, one word: ATS and ETS', qb: ['Q6', 'Q7', 'Q22'],
      say: ['When a start-up founder and a bank CIO both say “our stack”, they mean **different things**. Mixing them up is the commonest mistake in management conversations about IT.',
        'The **Application Technology Stack (ATS)** is what a company **builds software with**. It is tuned for **speed of change**. The **Enterprise Technology Stack (ETS)** is what a company **runs on**. It is tuned for **integrity, continuity and proof**. They fail in opposite directions, and they meet at one place: the **integration layer**.'],
      real: 'ATS is like a food-delivery app team shipping new features several times a day. ETS is like the bank’s accounts system that must give the right number and survive an audit. Different goals, different rhythm.',
      viz: [{ type: 'table', title: 'ATS vs ETS side by side', cols: ['', 'ATS (Application stack)', 'ETS (Enterprise stack)'], rows: [
        ['Question it answers', 'How fast can we change our software?', 'How reliably does the company run, and can we prove it?'],
        ['Mostly…', 'Built and assembled', 'Bought and configured'],
        ['Typical lifespan', '3–5 years before a rewrite', '10–20 years; upgrades, not replacements'],
        ['Release rhythm', 'Continuous, many times a day when healthy', 'Scheduled; regression-tested across every process it touches'],
        ['Who decides', 'Product and engineering leadership', 'CIO, CFO and business process owners'],
        ['Money shape', 'Operating spend, scales with usage', 'Capital programme plus ~22% of licence every year'],
        ['Failure looks like', 'Outage; slow, frightening releases', 'Wrong numbers; failed audit; a migration that will not end']] },
        { type: 'sort', title: 'Sort these into the right stack', buckets: ['ATS: builds software', 'ETS: runs the company'], items: [['SAP S/4HANA or Oracle Fusion ERP', 1], ['Workday (HR) as a system of record', 1], ['Single sign-on and MFA for all staff', 1], ['Microservices and APIs a dev team ships', 0], ['DevOps pipeline: continuous integration', 0], ['Rewritten every 3–5 years', 0], ['Upgraded, not replaced, over 10–20 years', 1], ['Failure = failed audit, wrong numbers', 1]] }],
      pts: ['**ATS** = what a company builds software with. Optimised for **speed of change**. Lifespan 3–5 years. Fails as outages and slow releases.', '**ETS** = what a company runs on. Optimised for **integrity, continuity and proof**. Lifespan 10–20 years. Fails as wrong numbers or a failed audit.', '**Examples, ATS (Q22):** microservices, APIs, DevOps / continuous integration (named in the DBS wheel and the Session 9 platform table). **Examples, ETS:** SAP S/4HANA, Oracle Fusion (systems of record); single sign-on and MFA (identity).', 'They meet at exactly one place: the **integration layer**, where most unbudgeted enterprise cost lives.'],
      check: { q: 'A start-up founder and a bank CIO both say “our stack”. What is each talking about, and which failure keeps each awake?', a: 'The founder means the **ATS** (what they build software with) and fears outages and slow releases. The CIO means the **ETS** (what the company runs on) and fears wrong numbers, a failed audit or a migration that will not end.' } },

    { id: 'layers', short: 'Reading the stack', title: 'Reading the stack from top to bottom', qb: ['Q9'],
      say: ['Picture the stack as five floors. Customers and staff only see the top floor. But when something goes wrong, the cause is usually several floors down.',
        'Example from the slides: “the delivery date shown at checkout is wrong.” It is **reported at the interface**, but it lives in **integration or data**. There are four possible causes, with four different owners and costs, and only one is the web team’s problem. Naming the right layer is the first skill this course teaches.'],
      real: 'A restaurant bill is wrong. The waiter (interface) gets blamed, but the cause may be the menu price in the system (data), or the till not talking to the kitchen screen (integration).',
      viz: [{ type: 'layers', title: 'Tap a layer. Problems are reported at the top, caused further down.', top: '▲ what people see', bottom: '▼ what everything stands on', layers: [
        { n: 'Interface', short: 'what the customer or employee sees', body: 'The screens, app or page people actually use. Reported problems show up here first.' },
        { n: 'Applications', short: 'ERP, CRM, HR, warehouse', body: 'The business systems, the **systems of record**: ERP, CRM, HR, warehouse management.' },
        { n: 'Integration', short: 'lets applications exchange information', body: 'What lets applications exchange information (APIs, gateways). Where most unbudgeted enterprise cost lives.' },
        { n: 'Data', short: 'stores, warehouses, pipelines', body: 'Operational stores, warehouses, and the pipelines between them.' },
        { n: 'Infrastructure', short: 'compute, storage, network', body: 'Compute, storage and network, owned or rented.' }] },
        { type: 'quiz', title: 'Locate the layer (practice examples)', qs: [
          { q: 'The checkout page shows the wrong delivery date even though the warehouse system has the right one. Which layer is the likely cause?', o: ['Interface only', 'Integration (the systems are not passing the date correctly)', 'Infrastructure only', 'None of them'], a: 1, w: 'The right date exists in one system but arrives wrong. That points to integration or data, not the screen.' },
          { q: 'Two systems hold different addresses for the same customer and nobody knows which is right. Which concept is missing?', o: ['A faster server', 'A designated system of record', 'A bigger screen', 'More APIs'], a: 1, w: 'A system of record is the one that is right by definition when two systems disagree.' },
          { q: 'The whole company’s systems slow to a crawl during a sale because capacity runs out. Which layer?', o: ['Interface', 'Applications', 'Infrastructure (compute, storage, network)', 'Governance'], a: 2, w: 'Capacity problems live in the infrastructure layer.' }] }],
      pts: ['Five layers, top to bottom: **Interface, Applications, Integration, Data, Infrastructure**.', 'Problems are **reported at the top and caused further down**.'],
      gap: ['**Front end vs back end (Q9).** Your slides name the layers but do not use the words “front end” and “back end”. The standard meaning: the **front end** is what users see and touch (a web page or app screen, such as the checkout page). The **back end** is the behind-the-scenes part that does the work (servers, business logic and databases, such as the system that works out the delivery date and stores the order). In your stack picture, front end ≈ the Interface layer; back end ≈ the layers below it.'],
      check: { q: 'What is the difference between the front end and the back end of an application? Give one example of each.', a: '**Front end:** what the user sees and uses, for example a shopping app’s checkout screen. **Back end:** the servers, logic and databases behind it, for example the system that stores the order and calculates the delivery date.' } },

    { id: 'six', short: 'Six enterprise layers', title: 'The enterprise stack in six layers (and what a system of record is)', qb: ['Q7', 'Q10'],
      say: ['You will never operate these layers, but you must be able to say which one a problem belongs to, because that decides who owns it, who pays and how long it takes to change.',
        'The key idea: a **system of record** is the one system that holds the authoritative version of a transaction, employee, customer or rupee. When two systems disagree, **this one is right by definition**. Every important thing in a firm should have exactly one system of record, and most have three.'],
      real: 'Think of your bank passbook versus a note in your diary. If they disagree about your balance, the bank’s ledger wins. That ledger is the system of record.',
      viz: { type: 'match', title: 'Match each layer to what it does', pairs: [['Systems of record', 'Hold the authoritative version of a transaction, employee, customer or rupee'], ['Integration', 'Move data between systems in a documented, governed way'], ['Data platform', 'Turn transaction records into something analysable across the whole firm'], ['Identity and access', 'Decide who may see and change what, and prove it afterwards'], ['Infrastructure', 'Where all of it runs'], ['Governance and security', 'Decision rights, protection, and the ability to prove compliance']] },
      pts: ['Six layers: **systems of record, integration, data platform, identity and access, infrastructure, governance and security**.', '**System of record (Q10):** the authoritative system for an entity; right by definition when systems disagree. **Example:** SAP S/4HANA or Oracle Fusion for transactions; Salesforce for customers; Workday for employees.', 'Names you may hear: SAP S/4HANA, Oracle Fusion, Dynamics, Salesforce, Workday (systems of record); APIs and gateways, MuleSoft, Boomi, Workato, Kafka (integration); warehouse, lake, lakehouse, ETL/ELT, master data management (data); directory, single sign-on, MFA, role-based access (identity); NIST CSF 2.0, ISO 27001, SOC 2, COBIT, India’s DPDP Act (governance).'],
      check: { q: 'What is a system of record? Give one example.', a: 'The one system designated as authoritative for a given thing (customer, employee, transaction). When systems disagree, it is right by definition. Example: **Workday for employee records** or **SAP S/4HANA for financial transactions**.' } },

    { id: 'vocab', short: 'Application-stack words', title: 'The application-stack vocabulary you will be asked about', qb: ['Q8', 'Q11', 'Q23', 'Q24', 'Q26'],
      say: ['The Question Bank asks about six terms from the “build software” side of the world. Your files only name some of them, so this lesson gives plain-English meanings (amber), then points to where your documents touch each one.'],
      real: 'Picture a restaurant. A **monolith** is one giant kitchen doing everything: simple, but if one station breaks, dinner stops. **Microservices** are many small stalls in a food court: each can change or fail alone, but you must coordinate them. (Teaching picture only.)',
      gap: [
        '**Monolithic architecture (Q8):** an application built as **one single unit**, with all its parts bundled and released together. *Advantage:* simpler to build, test and deploy at first (one codebase). *Disadvantage:* a small change means redeploying everything; it is hard to scale or fix one part without touching the rest.',
        '**Microservices (Q23):** an application split into **many small, independent services**, each doing one job and talking to the others through APIs. *Advantage:* each service can be changed, scaled or fixed on its own, so teams move faster. *Disadvantage:* many moving parts, so it is more complex to run and coordinate. Your docs: DBS’s GANDALF wheel lists “micro-services” and “API” under “Design for modern systems”.',
        '**API (Q11):** a published, agreed way for one program to ask another program to do something or share data. *Example:* a delivery app calls a payment provider’s API to take a payment. Your docs define it in the Session 9 glossary: “a published interface another program calls, usually versioned URLs over HTTPS. On a platform it is the product surface.” DBS launched an API platform with 150 APIs and 50+ partners (McDonald’s, AIG, Foodpanda).',
        '**CI/CD (Q24):** *Continuous Integration* = developers merge their code often and every change is automatically built and tested. *Continuous Delivery/Deployment* = tested changes are automatically released to users. *Why useful:* faster, safer, smaller releases. Your docs: “continuous integration” appears on DBS’s wheel, DBS automated its DevOps pipeline “from testing to deployment”, increasing release cadence **tenfold**, and Slide 16 says a healthy ATS releases “many times a day”.',
        '**Cloud-native (Q26):** applications designed from the start to run on the cloud, usually built as microservices that **scale up and down automatically** and recover by themselves. *Benefit:* you pay for and use only the capacity you need, and it keeps running when one part fails. Your docs: DBS’s wheel lists “dynamic scalability” and “auto recovery”.'],
      pts: ['The ATS words in your documents: microservices, API, DevOps, continuous integration, dynamic scalability, auto recovery, blue-green deploy, cloud security (DBS GANDALF wheel).', 'Release rhythm of a healthy ATS: continuous, many times a day (Session 1, slide 16).'],
      check: { q: 'In one line each: monolith vs microservices, and why is CI/CD useful?', a: 'Monolith = one big unit (simple at first, but any change redeploys everything). Microservices = many small independent services (flexible, but complex to coordinate). CI/CD automatically builds, tests and releases code, so releases are faster and safer.' } },

    { id: 'cloud', short: 'IaaS, PaaS, SaaS', title: 'Cloud flavours: IaaS, PaaS and SaaS', qb: ['L5A', 'Q4'],
      say: ['“Moving to the cloud” has three common flavours. The easiest way to remember them is by how much **you** still manage.',
        'Your slides only name them (“IaaS, PaaS, SaaS (NIST SP 800-145); private, public, hybrid”), so the explanation below is in amber.'],
      real: 'Think of getting a meal: buy raw ingredients and cook at home (IaaS: you rent the kitchen basics), use a rented ready kitchen where you only cook your recipe (PaaS), or order a finished dish (SaaS). (Teaching picture only.)',
      viz: { type: 'table', title: 'Who manages what', cols: ['', 'IaaS', 'PaaS', 'SaaS'], rows: [['You rent', 'Servers, storage, network', 'A ready platform to build and run your app', 'A finished application'], ['You manage', 'Operating system, apps, data', 'Your app and data', 'Just your settings and users'], ['Typical example', 'Rented servers from a cloud provider such as AWS', 'A managed app platform (e.g. Google App Engine, Azure App Service)', 'Salesforce, Workday, Oracle NetSuite, Microsoft Dynamics 365']] },
      gap: ['**IaaS (Infrastructure as a Service):** you rent raw computing (servers, storage, network) and install and run your own software. **PaaS (Platform as a Service):** you rent a platform that already handles servers and operating systems, so you only build and run your application. **SaaS (Software as a Service):** you use a finished application over the internet, paid by subscription. **Deployment models:** *private* cloud (used by one organisation), *public* cloud (shared provider), *hybrid* (a mix).', 'Examples tie to your files: AWS (launched 2006) is named in the 100-year reading; Salesforce, Workday, Oracle NetSuite and Microsoft Dynamics are named in Sessions 1–2 as business applications. The PaaS examples are general knowledge.'],
      pts: ['Your documents: “IaaS, PaaS, SaaS (NIST SP 800-145); private, public, hybrid” sit in the **Infrastructure** layer of the enterprise stack.', 'Megatherm’s RFP asked vendors to deploy on public cloud, private cloud, hybrid or on-premise infrastructure.'],
      check: { q: 'Describe IaaS, PaaS and SaaS. Give one example of each.', a: '**IaaS:** rent raw servers/storage/network (e.g. AWS). **PaaS:** rent a platform to build and run your app without managing servers (e.g. Google App Engine). **SaaS:** use finished software by subscription (e.g. Salesforce or Workday).' } },

    { id: 'integ', short: 'Integration layer', title: 'The integration layer: where the cost hides', qb: ['Q11', 'Q25'],
      say: ['No company runs one system. The average organisation manages **957 applications**, and only **27%** of them are connected to anything. The other 73% are islands, and every island is a manual process, a spreadsheet, or a person retyping data.',
        'Why does the **integration layer** exist? Because connecting systems one to one explodes. Ten systems can need 45 links; twenty can need 190. Route everything through one managed integration layer and you need about one link per system.'],
      real: 'Ten friends who each phone every other friend need 45 phone lines. One WhatsApp group needs ten. The group is the integration layer. (Teaching picture only.)',
      viz: { type: 'ncalc' },
      pts: ['**Integration layer (Q25):** the layer that lets applications exchange information in a documented, governed way. **Why needed:** it stops one-to-one connections multiplying (n(n−1)/2 links) and makes data flows controllable.', '957 apps on average, 27% connected; 36% of IT’s time goes on custom integrations; 81% of SaaS spend is controlled by business units (Salesforce Connectivity Benchmark 2026; Zylo 2026).', '“The second-most expensive thing in an enterprise landscape is having an integration layer. The most expensive is **not** having one.”', 'AI link: an agent can only act through an interface that exists, is documented and governed; 94% of IT leaders say agents will make architecture more API-driven.', 'Example of an API in use: DBS’s API platform, launched 2017 with 150 APIs across 20+ categories (Q11).'],
      check: { q: 'What is an integration layer? Give one reason it is needed.', a: 'The layer that lets applications exchange information in a documented, governed way. Needed because direct system-to-system links multiply quickly (n(n−1)/2) and become unmanageable.' } },

    { id: 'quad', short: 'Operating-model 2×2', title: 'Standardise or customise: the operating-model 2×2', qb: ['L6A'],
      say: ['This is the framework your professor reuses all course: Ross, Weill and Robertson (MIT CISR). It asks two questions about a company: **how much do its processes need to be the same everywhere** (standardisation), and **how much does its data need to be shared** (integration)?',
        'There is **no best quadrant**. Standardising kills local responsiveness; integrating kills local autonomy. The failure is not choosing the wrong one. It is **never choosing**, then buying technology that assumes an answer nobody agreed to.'],
      real: 'A chain of petrol pumps that must work identically everywhere (high standardisation) versus a holding company whose businesses barely interact (low on both). Technology bought for one is wrong for the other.',
      viz: [{ type: 'quad', title: 'Tap a quadrant', x: 'PROCESS STANDARDISATION (low → high)', y: 'DATA INTEGRATION (low → high)', cells: [
        { n: 'Coordination', sub: 'Shared customers, unique processes', body: 'Example: **Merrill Lynch**. High data integration, low process standardisation.' },
        { n: 'Unification', sub: 'One business, one way of working', body: 'Example: **UPS**. High on both. This is where Megatherm sits, or intends to be: one plant, one product family, one data model.' },
        { n: 'Diversification', sub: 'Independent units, few shared needs', body: 'Example: **Pacific Life**. Low on both.' },
        { n: 'Replication', sub: 'Same process, run independently', body: 'Example: **7-Eleven Japan**. High process standardisation, low data integration.' }] },
        { type: 'sort', title: 'Place the company in its quadrant', buckets: ['Coordination', 'Unification', 'Diversification', 'Replication'], items: [['UPS: one business, one way of working', 1], ['Merrill Lynch: shared customers, unique processes', 0], ['Pacific Life: independent units, few shared needs', 2], ['7-Eleven Japan: same process, run independently', 3]] }],
      pts: ['Two axes: **process standardisation** and **data integration**. Four models: **Coordination, Unification, Diversification, Replication**.', '**Configure vs customise (L6A):** *configuring* uses the system’s built-in settings (cheap, supported, survives upgrades). *Customising* changes the system to fit current habits (paid once in cash and **forever in upgrade cost**).', 'Listen for “we will configure that” (cheap) vs “we will customise that” (neither supported nor cheap).'],
      check: { q: 'What is the difference between configuring and customising? Why does customisation raise long-term cost?', a: 'Configuring uses supported built-in settings and survives upgrades. Customising changes the software itself, so it is paid for once in cash and **forever in upgrade cost**: every upgrade must retest and redo the changes. It also tends to produce a heavily modified system that cannot be upgraded.' } },

    { id: 'gov', short: 'Governance, security, compliance', title: 'Governance, security and compliance are three different questions', qb: [],
      say: ['People use these words as if they mean one thing. They do not. A company can be **secure but non-compliant**, or **compliant but insecure**. Both are common.',
        '**Governance:** who has the right to decide, and who answers for the outcome. **Security:** are the systems and data protected from a hostile party. **Compliance:** can you show an external, sceptical person that you did what the law and your own policy require.'],
      viz: { type: 'flip', title: 'NIST CSF 2.0: six functions to ask about by name', cards: [['GOVERN', 'Who decides and answers for security.'], ['IDENTIFY', 'Know what you have and what is at risk.'], ['PROTECT', 'Safeguards that reduce the chance of harm.'], ['DETECT', 'Spot a problem quickly.'], ['RESPOND', 'What you do when something happens.'], ['RECOVER', 'Get back to normal after an incident.']] },
      pts: ['Most security briefings are heavy on PROTECT, thin on DETECT and RESPOND, silent on RECOVER.', 'Global average data-breach cost 2026: **$4.99m** (record, +12%). India: **₹25.5cr** (+15.9%). One in four malicious breaches is AI-enabled.', '**DPDP Act penalty:** up to **₹250cr per breach** (per breach, not per year, not a share of turnover) for failing reasonable security safeguards. DPDP Rules notified Nov 2025; main obligations expected around **May 2027**.'],
      check: { q: 'Name the six NIST CSF 2.0 functions.', a: 'GOVERN, IDENTIFY, PROTECT, DETECT, RESPOND, RECOVER.' } },

    { id: 'money', short: 'Where the money goes', title: 'Where the money actually goes (and the six questions to ask)', qb: [],
      say: ['Two facts explain most enterprise IT budgets. First, **22% of the licence value, every year, goes on maintenance** (SAP’s list rate, and Oracle’s works out to the same: $47,500 licence, $10,450 support). A licence is not a purchase, it is a purchase plus a subscription nobody called one. It repays its own price roughly every four and a half years.',
        'Second, about **half of a technology budget runs what already exists** (run) rather than builds something new (change). So the real question about a new system is not “what does it cost to build?” but “what does it add to the permanent floor?”'],
      viz: { type: 'flip', title: 'Six questions to take into any technology conversation', cards: [
        ['1 · Which stack?', 'Shipping software fast (ATS) and running the company reliably (ETS) are different decisions with different owners.'],
        ['2 · What operating model?', 'What does this assume, and have we agreed to it? If not, project management will not fix it.'],
        ['3 · Configure or customise?', 'One is supported and survives upgrades; the other is paid once in cash and forever in upgrade cost.'],
        ['4 · How many systems?', 'Four systems through documented APIs is a quarter’s work; through undocumented interfaces it is a project.'],
        ['5 · Run vs change?', 'Judge a system by what it adds to the permanent floor, not what it costs to build.'],
        ['6 · Worst-case data loss?', 'Name the regulation, the notification clock and the maximum penalty.']] },

PHASES.push({
  id: 'p3', n: 3, part: 'Part A · In your question bank', title: 'ERP and the Megatherm Case', nav: 'ERP & Megatherm',

  bridge: 'Megatherm shows a company choosing a system. Next: DBS, a whole bank that rebuilt itself around technology.',
  lessons: [
    { id: 'erp', short: 'What an ERP is', title: 'What an ERP really is', qb: ['L1A'],
      say: ['An ERP (Enterprise Resource Planning) is **not just software. It is a shared data model with modules on top.** Finance, procurement, inventory, manufacturing, sales and service all use **one definition** of a customer, a part, a cost centre, a transaction.',
        'The value: a sale recorded once updates inventory, receivables, the production plan and the ledger in one motion. The cost: every function must **accept one definition of the same object**. Sales, plant and finance must agree what “delivered” means. That negotiation is the real implementation. Installing the software is the easy part.'],
      real: 'A family business where the shop, the godown and the accountant each keep their own notebook. ERP is one shared notebook everyone writes in.',
      viz: { type: 'tour', numbered: true, title: 'One sale, recorded once', items: [{ label: 'Sale entered', body: 'A sale is recorded in the shared data model.' }, { label: 'Inventory', body: 'Stock falls automatically.' }, { label: 'Receivables', body: 'Money owed by the customer rises.' }, { label: 'Production plan', body: 'The production plan adjusts.' }, { label: 'Ledger', body: 'The accounting ledger updates, all in one motion.' }] },
      pts: ['**ERP (L1A):** a suite of integrated applications on one shared data model that standardises and automates core functions across departments (single source of truth).', '**Four functions for Megatherm:** Finance and Controlling; Procurement (materials management); Production planning/manufacturing; Sales and Distribution (also CRM, after-sales service, SRM, logistics).', 'ERP projects fail “not due to technology limitations, but due to misalignment between system functionality, organizational needs, and implementation readiness” (the case).'],
      check: { q: 'What is an ERP system? Name four functions it would integrate for Megatherm.', a: 'Integrated software on one shared data model giving a single source of truth. For Megatherm: **finance, procurement, manufacturing/production planning, and sales and distribution** (plus service, CRM, logistics).' } },

    { id: 'ea', short: 'Architecture layers', title: 'ERP is an architecture decision, not a purchase', qb: [],
      say: ['Enterprise architecture is the argument for why you have the stack you have. It has four layers, and ERP touches all four.', 'A decision made only in the fourth box (cloud or on-premise, which vendor, how much) is a technology purchase. Made in the first box it is an architecture decision. Megatherm did the fourth well and the first barely at all.'],
      viz: { type: 'table', title: 'Four architecture layers', cols: ['Layer', 'What it covers', 'Question'], rows: [['Business', 'Which processes exist, who owns them', 'Which processes must be identical across plants and countries?'], ['Data', 'What an entity means, where it is mastered', 'Where is “customer” mastered, and is there exactly one answer?'], ['Application', 'Which systems exist, what each is record for', 'One suite, or core plus best-of-breed?'], ['Technology', 'Compute, storage, network, integration, identity', 'Public, private, hybrid or on-premise?']] },
      pts: ['ERP is “a business-architecture decision wearing an application-layer costume”.', 'Nowhere in the case does anyone state Megatherm’s operating model. The evaluation runs on vendor features. That absence is the real finding.'] },

    { id: 'cycles', short: 'Four cycles', title: 'The four cycles every ERP runs (P2P, O2C and more)', qb: ['L2A', 'L2B'],
      say: ['Learn the **cycles**, not the module names. Vendors rename modules, but the cycles have not changed in thirty years.', 'Procure-to-Pay is how you buy and pay. Order-to-Cash is how you sell and get paid. Plan-to-Produce is how you make things. Record-to-Report is how everything ends up in the books.'],
      real: 'P2P is a tea shop buying milk: ask, order, receive, check the bill against what was ordered and received, pay. O2C is the reverse: customer asks, you quote, deliver, bill, collect.',
      viz: [{ type: 'tour', title: 'Tap a cycle', items: [
        { label: 'Procure to Pay (P2P)', title: 'Procure to Pay · Materials Management', body: '**Requisition → purchase order → goods receipt → invoice → three-way match → payment.** Where fraud and duplicate payment live. The three-way match is the control (checks the order, the goods received and the invoice agree).' },
        { label: 'Order to Cash (O2C)', title: 'Order to Cash · Sales and Distribution', body: '**Enquiry → quote → order → availability check → despatch → invoice → collection → cash application.** Where revenue recognition and the e-invoicing clock live. Touches CRM and service.' },
        { label: 'Plan to Produce', title: 'Plan to Produce · Production Planning', body: '**Demand plan → master schedule → material requirements → works order → shop floor → finished goods.** Where the bill of materials lives. For Megatherm the hardest cycle to standardise (engineer-to-order, long lead times).' },
        { label: 'Record to Report', title: 'Record to Report · Finance and Controlling', body: '**Sub-ledger postings → period close → reconciliation → consolidation → statutory and management reporting.** What a listed company is audited on. Every other cycle drains into it.' }] },
        { type: 'sort', title: 'Which cycle does each step belong to?', buckets: ['Procure to Pay', 'Order to Cash'], items: [['Purchase order', 0], ['Goods receipt', 0], ['Three-way match', 0], ['Payment to supplier', 0], ['Quote', 1], ['Availability check', 1], ['Despatch', 1], ['Cash application', 1]] }],
      pts: ['**P2P steps (L2A):** requisition, purchase order, goods receipt, invoice, three-way match, payment.', '**O2C steps (L2B):** enquiry, quote, order, availability check, despatch, invoice, collection, cash application.', 'Megatherm’s RFP asked for all four cycles plus CRM, after-sales service, SRM and logistics: a full-suite scope for 550 employees and one plant.'],
      check: { q: 'Describe Procure-to-Pay and list its main steps.', a: 'The end-to-end cycle for buying and paying: requisition → purchase order → goods receipt → invoice → three-way match → payment. The three-way match is the key control against fraud and duplicate payment.' } },

    { id: 'meg', short: 'Meet Megatherm', title: 'The story: Megatherm Induction Limited', qb: [],

      viz: [{ type: 'big', title: 'Megatherm at a glance (FY24)', items: [['$37.12m', 'revenue (up from $25.41m in FY22)'], ['13.6%', 'EBITDA margin'], ['6.8%', 'profit after tax margin'], ['9%', 'of revenue spent on R&D (~$3.34m)'], ['550+', 'employees; 55 R&D engineers, 17 PhDs']] },
        { type: 'tour', title: 'Four gaps in the old systems, and how the team decided', items: [

          { label: 'Define-Evaluate-Select', body: '**Define:** departments document processes and requirements into an RFP. **Evaluate:** weighted scoring and the **M-D-N** method (must-have, desired, nice-to-have), balanced-scorecard thinking, value analysis. **Select:** pick the balance of readiness and scalability, not the cheapest or the most features.' },

      pts: ['A **request for proposal (RFP)** lists requirements sent to vendors. The CIO led the project team.', 'The case: ERP selection is “a strategic commitment, not a transactional purchase”.'] },

    { id: 'opts', short: 'Five options', title: 'The five options on the table', qb: [],

      viz: [{ type: 'flip', title: 'Tap each option for its bet', cards: [
